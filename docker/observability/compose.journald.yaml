# Optional: hands the logs of the three Java runtime roles to the host journal, where config.alloy in
# this directory can read them. Add it after the deployment's other compose files. It needs Compose
# 2.24.4 or later for `!override`, which drops the json-file size options that the journald driver rejects.
#
# Only these three services get the `hephaestus-runtime` tag that the collector matches on. Their lines
# are ECS JSON from this release on. The webapp's nginx error log, PostgreSQL (whose error lines can
# quote rejected row values), NATS, the proxy and sandbox containers keep their own size-bounded
# json-file logs, so a collector that reads only tagged entries never ships them. The tag is new, so
# journal entries written before this overlay was added never match it.
#
# Delivery to journald is non-blocking: when journald falls behind by more than the 4 MiB buffer, the
# newest lines are dropped instead of stalling the application. journald's own RateLimitBurst can also
# drop lines, and the host's SystemMaxUse bounds how much it keeps. docs/admin/observability.mdx
# explains both limits.
services:
  application-server:
    logging: !override
      driver: journald
      options:
        tag: hephaestus-runtime
        mode: non-blocking
        max-buffer-size: 4m
  application-worker:
    logging: !override
      driver: journald
      options:
        tag: hephaestus-runtime
        mode: non-blocking
        max-buffer-size: 4m
  webhook-server:
    logging: !override
      driver: journald
      options:
        tag: hephaestus-runtime
        mode: non-blocking
        max-buffer-size: 4m
