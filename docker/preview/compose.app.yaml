# Per-PR application stack for Coolify preview deployments.
#
# Deploy as a Docker Compose application pointed at this file, with "Connect to Predefined
# Network" enabled. The app server also joins staging's `shared-network` to consume from its NATS.
# Assign two domains on the base application: webapp → the SPA host, appserver → its API
# sibling (api.<domain>). Previews inherit both with a pr<id> prefix.
#
# Coolify injects SERVICE_FQDN_<SERVICE> (host, no scheme), SERVICE_URL_<SERVICE> and
# SERVICE_NAME_<SERVICE> (the per-deploy container/network alias).
#
# Never use `${VAR:?message}` here: Coolify's compose parser seeds its environment store from
# these placeholders and keeps the *message* as the value, so `:?Required` becomes the literal
# string "Required". Leave required vars bare and let the app's own fail-fast report them.

services:
  # No `hostname:` override: every stack shares Coolify's `coolify` network, where a fixed
  # hostname would make each preview's postgres answer to the same name and let one preview's
  # app-server reach another's database. The service key is already a per-deploy alias —
  # reference it through SERVICE_NAME_POSTGRES.
  postgres:
    image: ghcr.io/ls1intum/hephaestus/postgres:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      POSTGRES_DB: hephaestus
      POSTGRES_USER: hephaestus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hephaestus-preview}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hephaestus -d hephaestus"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # Clones the running staging database into a PR preview so it starts with real data. This only
  # ever reads through pg_dump: it never mounts staging's data volume or starts a second Postgres
  # against that live volume. After restore, all review entry points are paused before the app boots.
  seed-loader:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-hephaestus-preview}
      SERVICE_NAME_POSTGRES: ${SERVICE_NAME_POSTGRES:-}
      SERVICE_FQDN_APPSERVER: ${SERVICE_FQDN_APPSERVER:-}
      SERVICE_FQDN_WEBAPP: ${SERVICE_FQDN_WEBAPP:-}
      PREVIEW_SEED_SOURCE_CONTAINER: ${PREVIEW_SEED_SOURCE_CONTAINER:-app-postgres-1}
      PREVIEW_SEED_SOURCE_USERNAME: ${PREVIEW_SEED_SOURCE_USERNAME:-root}
      PREVIEW_SEED_SOURCE_DATABASE: ${PREVIEW_SEED_SOURCE_DATABASE:-hephaestus}
    command:
      - sh
      - -c
      - |
        set -eu
        apk add --no-cache docker-cli >/tmp/apk.log 2>&1

        APP_FQDN="$${SERVICE_FQDN_APPSERVER:-$${SERVICE_FQDN_WEBAPP:-}}"
        if ! echo "$$APP_FQDN" | grep -Eq "^pr[0-9]+"; then
          echo "Skipping seed-loader: non-PR deployment detected"
          exit 0
        fi

        SOURCE_CTN="$$PREVIEW_SEED_SOURCE_CONTAINER"
        PREVIEW_PG_SERVICE="$${SERVICE_NAME_POSTGRES:-}"
        COMPOSE_PROJECT=$$(docker inspect "$$HOSTNAME" \
          --format '{{ index .Config.Labels "com.docker.compose.project" }}')
        PREVIEW_PG=$$(docker ps \
          --filter "label=com.docker.compose.project=$$COMPOSE_PROJECT" \
          --filter "label=com.docker.compose.service=$$PREVIEW_PG_SERVICE" \
          --format "{{.Names}}")
        PREVIEW_PG_COUNT=$$(printf '%s\n' "$$PREVIEW_PG" | awk 'NF { count++ } END { print count + 0 }')
        if [ -z "$$PREVIEW_PG_SERVICE" ] || [ "$$PREVIEW_PG_COUNT" -ne 1 ]; then
          echo "Could not uniquely resolve this preview's Postgres container from its Compose labels"
          exit 1
        fi
        if [ "$$SOURCE_CTN" = "$$PREVIEW_PG" ]; then
          echo "Refusing to use the preview database as its own seed source"
          exit 1
        fi
        if ! docker ps --format "{{.Names}}" | grep -Fxq "$$SOURCE_CTN"; then
          echo "Staging seed source '$$SOURCE_CTN' is not running"
          exit 1
        fi
        if docker exec "$$PREVIEW_PG" test -f /var/lib/postgresql/data/.hephaestus-preview-seeded; then
          echo "Skipping seed-loader: this preview has already been seeded"
          exit 0
        fi

        echo "Dumping staging data from $$SOURCE_CTN"
        docker exec "$$SOURCE_CTN" pg_dump \
          -U "$$PREVIEW_SEED_SOURCE_USERNAME" \
          -d "$$PREVIEW_SEED_SOURCE_DATABASE" \
          --format=custom --no-owner --no-privileges > /tmp/seed.dump
        test -s /tmp/seed.dump

        echo "Resetting the private preview database"
        docker exec "$$PREVIEW_PG" psql \
          -v ON_ERROR_STOP=1 -U hephaestus -d postgres \
          -c 'DROP DATABASE IF EXISTS hephaestus WITH (FORCE);' \
          -c 'CREATE DATABASE hephaestus OWNER hephaestus;'

        echo "Restoring staging data into $$PREVIEW_PG"
        docker exec -i "$$PREVIEW_PG" pg_restore \
          -U hephaestus -d hephaestus \
          --exit-on-error --no-owner --no-privileges < /tmp/seed.dump

        # The policy is inline rather than a mounted .sql file: Coolify materialises a relative bind
        # mount as an empty managed directory, and `psql < <directory>` reads nothing and exits 0 —
        # a clone that silently kept every trigger, binding and credential of the instance it came
        # from. The verification below is what actually holds the line; see README.md.
        echo "Applying the preview policy"
        docker exec -i "$$PREVIEW_PG" psql -v ON_ERROR_STOP=1 -U hephaestus -d hephaestus <<'SQL'
        -- 1. Silence: a clone must not act.
        UPDATE workspace
           SET practice_review_auto_trigger_enabled = FALSE,
               practice_review_manual_trigger_enabled = FALSE;

        UPDATE workspace_agent_binding
           SET enabled = FALSE,
               updated_at = NOW()
         WHERE purpose = 'PRACTICE_REVIEW';

        UPDATE review_sweep_schedule
           SET enabled = FALSE,
               updated_at = NOW();

        UPDATE agent_job
           SET status = 'CANCELLED',
               completed_at = COALESCE(completed_at, NOW()),
               worker_id = NULL,
               error_message = 'Cancelled when staging data was cloned into a preview.',
               cancellation_reason = NULL
         WHERE status IN ('QUEUED', 'RUNNING');

        UPDATE agent_job
           SET delivery_status = 'FAILED',
               error_message = CONCAT_WS(E'\n', NULLIF(error_message, ''),
                   'Delivery paused when staging data was cloned into a preview.')
         WHERE status = 'COMPLETED'
           AND delivery_status = 'PENDING';

        UPDATE sync_job
           SET status = 'CANCELLED',
               cancel_requested = TRUE,
               finished_at = COALESCE(finished_at, NOW()),
               heartbeat_at = NULL,
               error_summary = 'Cancelled when staging data was cloned into a preview.'
         WHERE status IN ('PENDING', 'RUNNING');

        -- 2. Re-home: a clone must not keep the source instance's identity. Each table is rebuilt
        -- from this deployment's own configuration on boot. identity_link keys on identity_provider,
        -- not on login_provider, so accounts survive.
        DELETE FROM issued_jwt;
        DELETE FROM jwt_signing_key;
        DELETE FROM login_provider;
        SQL

        # The marker is a promise that the policy is in force, so it is written only against the
        # database's own answer. Anything that leaves a live trigger, binding, job or inherited
        # identity behind fails the deployment instead of starting an application server on a clone
        # that can act as the instance it was copied from.
        echo "Verifying the preview policy took effect"
        LIVE=$$(docker exec "$$PREVIEW_PG" psql -tAX -v ON_ERROR_STOP=1 -U hephaestus -d hephaestus -c "
          SELECT (SELECT count(*) FROM workspace
                   WHERE practice_review_auto_trigger_enabled OR practice_review_manual_trigger_enabled)
               + (SELECT count(*) FROM workspace_agent_binding WHERE enabled AND purpose = 'PRACTICE_REVIEW')
               + (SELECT count(*) FROM review_sweep_schedule WHERE enabled)
               + (SELECT count(*) FROM agent_job WHERE status IN ('QUEUED', 'RUNNING'))
               + (SELECT count(*) FROM sync_job WHERE status IN ('PENDING', 'RUNNING'))
               + (SELECT count(*) FROM login_provider)
               + (SELECT count(*) FROM jwt_signing_key)
               + (SELECT count(*) FROM issued_jwt)")
        if [ "$$LIVE" != "0" ]; then
          echo "Preview policy did not take effect ($$LIVE rows still live); refusing to mark this preview seeded"
          exit 1
        fi

        docker exec "$$PREVIEW_PG" touch /var/lib/postgresql/data/.hephaestus-preview-seeded
        echo "Seed loaded; reviews are paused and the preview owns its login apps and signing key"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # A new named volume is created root-owned, and one created by an earlier image keeps that image's
  # uid. The buildpack image runs as `cnb` (1002:1001), so nothing under /data/git-repos is writable
  # until the ownership matches — and that surfaces when an agent job first writes there, not at
  # startup. -h so a symlink inside a checkout is retargeted rather than followed out of the volume.
  volume-init:
    image: alpine:3@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    command:
      - sh
      - -c
      - "chown -Rh 1002:1001 /data/git-repos && chmod 0755 /data/git-repos"
    volumes:
      - git-repos:/data/git-repos
    restart: "no"
    network_mode: none

  # The service name must stay dash-free. Coolify stores a service's configured domain under the
  # service name but looks it up with dashes replaced by underscores, so a dashed name never
  # matches and the domain is overwritten with an auto-generated host on every deploy.
  #
  # There is no server/Dockerfile — the image comes from Paketo buildpacks (spring-boot:build-image
  # in server/pom.xml), which also supplies the /workspace/health-check binary. ci-docker-build.yml
  # publishes an immutable image for every code PR commit. Coolify injects that commit as
  # SOURCE_COMMIT, so previews cannot accidentally share or race on a mutable PR-wide image tag.
  #
  # Previews are single-replica, so the mentor sticky-cookie labels from docker/compose.app.yaml
  # would be a no-op and are omitted (docs/contributor/unified-pi-runtime.mdx).
  appserver:
    image: ghcr.io/ls1intum/hephaestus/application-server:${IMAGE_TAG:-${SOURCE_COMMIT:-latest}}
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      # The buildpack's 10M MaxDirectMemorySize sits below this role's steady NIO
      # footprint (NATS + HTTP); give it headroom.
      JAVA_TOOL_OPTIONS: "-XX:MaxDirectMemorySize=${APP_MAX_DIRECT_MEMORY:-128M}"
      SPRING_PROFILES_ACTIVE: prod
      # prod runs forward-headers=native, so ProxyTrustGuard aborts the boot unless this is set.
      # Write this Tomcat internal-proxies regex WITHOUT backslashes: Coolify re-escapes them when
      # it writes the stack .env, so `172\.18\.` reaches the container doubled and matches nothing.
      # The valve then distrusts the proxy, X-Forwarded-Proto is dropped and OAuth redirect_uris are
      # built as http://. An unescaped '.' matches any character, which is harmless for an IP range:
      # 172.(1[6-9]|2[0-9]|3[01]).[0-9]{1,3}.[0-9]{1,3}
      HEPHAESTUS_TRUSTED_PROXIES: ${HEPHAESTUS_TRUSTED_PROXIES}
      # Previews run non-release images with no release-pin, so don't require a digest-pinned agent image.
      HEPHAESTUS_AGENT_IMAGE_REQUIRE_DIGEST: ${HEPHAESTUS_AGENT_IMAGE_REQUIRE_DIGEST:-false}
      # The SPA's origin, not this server's: it feeds hephaestus.cors.allowed-origins,
      # hephaestus.webapp.url and the links the app hands to users.
      APPLICATION_HOST_URL: https://${SERVICE_FQDN_WEBAPP}
      # The API is served at the ROOT of its own host (Coolify cannot route a compose service on a
      # path — it regenerates a host-only domain — so the SPA and API get sibling hosts). Nothing
      # strips a prefix here, so the /api base path that application-prod.yml pins for production
      # must be cleared, or every OAuth callback is built one segment too deep and 404s.
      HEPHAESTUS_AUTH_API_BASE_PATH: ""
      # Internal, trusted docker-network DB: skip TLS. pgJDBC does not validate Postgres' self-signed
      # cert, so the handshake adds no authentication — only NIO direct buffers that OOM the JVM's
      # off-heap default.
      DATABASE_URL: postgresql://${SERVICE_NAME_POSTGRES:-postgres}:5432/hephaestus?sslmode=disable
      DATABASE_USERNAME: hephaestus
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-hephaestus-preview}
      NATS_SERVER: ${NATS_SERVER:-nats://nats-server:4222}
      # hephaestus.sync.nats.server defaults to ${NATS_SERVER} and can be pinned separately: the
      # integration consumer may point at an upstream NATS (e.g. staging's) to consume events a
      # shared GitHub App delivers there. The agent job queue runs on PostgreSQL, not NATS, so it
      # has no server to pin — it is always local to this stack's own database.
      HEPHAESTUS_SYNC_NATS_SERVER: ${HEPHAESTUS_SYNC_NATS_SERVER:-${NATS_SERVER:-nats://nats-server:4222}}
      NATS_ENABLED: ${NATS_ENABLED:-true}
      # Per-deploy durable name, so base and previews get their own JetStream consumers instead of
      # competing for one and stealing each other's messages.
      NATS_DURABLE_CONSUMER_NAME: ${SERVICE_NAME_APPSERVER:-appserver}-consumer
      # A preview is deleted, not shut down, so it never removes the durables it created on the
      # shared stream. Long enough that a redeploy, or a testing session paused overnight, resumes
      # on its own cursor instead of skipping ahead to the head of the stream.
      HEPHAESTUS_INTEGRATION_CONSUMER_INACTIVE_THRESHOLD: ${HEPHAESTUS_INTEGRATION_CONSUMER_INACTIVE_THRESHOLD:-72h}
      # Issuer is this deploy's own origin, so a preview's tokens validate against the deploy that
      # issued them (Hephaestus-native auth, ADR 0017).
      HEPHAESTUS_AUTH_ISSUER: https://${SERVICE_FQDN_WEBAPP}
      HEPHAESTUS_AUTH_STATE_COOKIE_KEY: ${HEPHAESTUS_AUTH_STATE_COOKIE_KEY}
      # The admin UI is admin-gated, so the first super-admin has to come from operator config.
      HEPHAESTUS_AUTH_BOOTSTRAP_ADMINS: ${HEPHAESTUS_AUTH_BOOTSTRAP_ADMINS:-}
      # AES-256-GCM key (exactly 32 chars) for credentials encrypted at rest. Required wherever
      # Liquibase runs — its backfill re-encrypts on boot.
      HEPHAESTUS_SECURITY_ENCRYPTION_KEY: ${HEPHAESTUS_SECURITY_ENCRYPTION_KEY}
      # Sourced from GH_OAUTH_* — GitHub Actions reserves the GITHUB_ prefix for secret names.
      GITHUB_OAUTH_CLIENT_ID: ${GH_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GH_OAUTH_CLIENT_SECRET:-}
      GITLAB_OAUTH_CLIENT_ID: ${GITLAB_OAUTH_CLIENT_ID:-}
      GITLAB_OAUTH_CLIENT_SECRET: ${GITLAB_OAUTH_CLIENT_SECRET:-}
      GITLAB_OAUTH_BASE_URL: ${GITLAB_OAUTH_BASE_URL:-https://gitlab.com}
      GITLAB_OAUTH_DISPLAY_NAME: ${GITLAB_OAUTH_DISPLAY_NAME:-GitLab}
      GH_APP_ID: ${GH_APP_ID}
      GH_APP_PRIVATE_KEY: ${GH_APP_PRIVATE_KEY}
      GH_APP_INSTALLATION_URL: ${GH_APP_INSTALLATION_URL:-}
      GH_AUTH_TOKEN: ${GH_AUTH_TOKEN}
      GITLAB_ENABLED: ${GITLAB_ENABLED:-false}
      # Follows GITLAB_OAUTH_BASE_URL when unset, matching docker/compose.app.yaml and
      # application.yml. A concrete default here would win over that chain and pin every deployment
      # of this file to one instance.
      GITLAB_DEFAULT_SERVER_URL: ${GITLAB_DEFAULT_SERVER_URL:-${GITLAB_OAUTH_BASE_URL:-https://gitlab.com}}
      GITLAB_WORKSPACE_CREATION: ${GITLAB_WORKSPACE_CREATION:-false}
      # Slack OAuth/admin and mentor replies run here; inbound Events API and interactivity are
      # verified on webhook-server, which needs the same signing secret.
      HEPHAESTUS_INTEGRATION_SLACK_ENABLED: ${HEPHAESTUS_INTEGRATION_SLACK_ENABLED:-false}
      HEPHAESTUS_INTEGRATION_SLACK_CLIENT_ID: ${HEPHAESTUS_INTEGRATION_SLACK_CLIENT_ID:-}
      HEPHAESTUS_INTEGRATION_SLACK_CLIENT_SECRET: ${HEPHAESTUS_INTEGRATION_SLACK_CLIENT_SECRET:-}
      HEPHAESTUS_INTEGRATION_SLACK_SIGNING_SECRET: ${HEPHAESTUS_INTEGRATION_SLACK_SIGNING_SECRET:-}
      HEPHAESTUS_INTEGRATION_SLACK_REDIRECT_URI: ${HEPHAESTUS_INTEGRATION_SLACK_REDIRECT_URI:-}
      # Outline (documentation content source). Every Outline bean is @ConditionalOnProperty with
      # matchIfMissing=false, so an unset flag means no admin surface, no sync, no content projection.
      # This pod also runs the worker role in-process (see above), and the Outline ContentSource has no
      # runtime-role gate — the same flag is what puts wiki documents into the sandbox context here.
      # Inbound change notifications land on staging's webhook receiver, which enables this flag
      # independently but needs no shared secret: Outline's secret is stored on the connection row.
      HEPHAESTUS_INTEGRATION_OUTLINE_ENABLED: ${HEPHAESTUS_INTEGRATION_OUTLINE_ENABLED:-false}
      HEPHAESTUS_INTEGRATION_OUTLINE_ALLOWED_ORIGINS: ${HEPHAESTUS_INTEGRATION_OUTLINE_ALLOWED_ORIGINS:-}
      # Link-only login provider (Slack-style account linking, never a sign-in button). BASE_URL is
      # REQUIRED whenever CLIENT_ID is set — Outline is self-hosted, so there is no default origin, and
      # a blank/invalid value makes LoginProviderService log an ERROR and skip the seed. The callback is
      # built from the API request's own origin plus HEPHAESTUS_AUTH_API_BASE_PATH, which is cleared
      # here — so it is https://<appserver-fqdn>/login/oauth2/code/outline, with NO /api segment (unlike
      # production). Outline matches redirect URIs exactly, so a per-PR host needs its own OAuth app.
      OUTLINE_OAUTH_BASE_URL: ${OUTLINE_OAUTH_BASE_URL:-}
      OUTLINE_OAUTH_DISPLAY_NAME: ${OUTLINE_OAUTH_DISPLAY_NAME:-Outline}
      OUTLINE_OAUTH_CLIENT_ID: ${OUTLINE_OAUTH_CLIENT_ID:-}
      OUTLINE_OAUTH_CLIENT_SECRET: ${OUTLINE_OAUTH_CLIENT_SECRET:-}
      # Feature flag; application.yml reads this exact name (see docker/compose.app.yaml).
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      HEPHAESTUS_FABRIC_ROOT: /data/git-repos
      HEPHAESTUS_FABRIC_GC_RETENTION_DAYS: ${HEPHAESTUS_FABRIC_GC_RETENTION_DAYS:-30}
      GIT_CHECKOUT_ENABLED: ${GIT_CHECKOUT_ENABLED:-true}
      # There is no separate worker container: hephaestus.runtime.worker.enabled defaults to true,
      # so this pod runs the worker role in-process and executes agent runs itself. That needs the
      # host Docker daemon — hence the docker.sock mount below.
      SANDBOX_DOCKER_HOST: ${SANDBOX_DOCKER_HOST:-unix:///var/run/docker.sock}
      # Previews share one host — keep the sandbox footprint small.
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-1}
      SANDBOX_MEMORY_BYTES: ${SANDBOX_MEMORY_BYTES:-2147483648}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-1.0}
      # LLM providers are registered at runtime (Instance admin → AI models); the proxy reads each
      # connection's base URL/auth from the catalog per request, so no env var routes it here.
      MONITORING_TIMEFRAME: ${MONITORING_TIMEFRAME:-14}
      MONITORING_RUN_ON_STARTUP: ${MONITORING_RUN_ON_STARTUP:-false}
      MONITORING_SYNC_CRON: ${MONITORING_SYNC_CRON:-0 0 2 * * *}
      MONITORING_BACKFILL_ENABLED: "false"
      LEADERBOARD_NOTIFICATION_ENABLED: "false"
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Auto-registration target for GitLab webhooks: staging's receiver, not this deploy's origin.
      # Bare origin — GitLabWebhookService appends /webhooks/gitlab itself.
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      WEBHOOK_EXTERNAL_URL: ${WEBHOOK_EXTERNAL_URL:-https://staging.hephaestus.aet.cit.tum.de}
      THC_PORT: "8080"
      THC_PATH: /actuator/health/liveness
    # Joins the host's docker group so the unprivileged image can reach root:docker 0660
    # /var/run/docker.sock. Host-specific — see DOCKER_GROUP_ID in .env.example.
    group_add:
      - "${DOCKER_GROUP_ID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - git-repos:/data/git-repos
    networks:
      - default
      - staging-shared
    depends_on:
      postgres:
        condition: service_healthy
      seed-loader:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
    # The distroless image has no shell; the probe is the static thc binary the health-checker
    # buildpack adds at /workspace/health-check.
    healthcheck:
      test: ["CMD", "/workspace/health-check"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G

  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
      args:
        COOLIFY_BRANCH: ${COOLIFY_BRANCH:-}
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    restart: unless-stopped
    environment:
      APPLICATION_VERSION: preview
      APPLICATION_CLIENT_URL: https://${SERVICE_FQDN_WEBAPP}
      GIT_BRANCH: ${COOLIFY_BRANCH:-}
      GIT_COMMIT: ${SOURCE_COMMIT:-}
      # The API's sibling host under the same registrable domain, so the session cookie is same-site
      # and rides XHR normally; CORS admits this origin via APPLICATION_HOST_URL above.
      APPLICATION_SERVER_URL: https://${SERVICE_FQDN_APPSERVER}
      TANSTACK_DEVTOOLS_ENABLED: ${TANSTACK_DEVTOOLS_ENABLED:-true}
      SENTRY_ENVIRONMENT: preview
      SENTRY_DSN: ${SENTRY_DSN:-}
      POSTHOG_ENABLED: "false"
    depends_on:
      appserver:
        # Don't serve the SPA before the API answers.
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  staging-shared:
    external: true
    name: shared-network

volumes:
  postgres-data:
  git-repos:
