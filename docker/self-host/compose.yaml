# Blessed single-host topology. Prepare `.env` and `release-lock.env` as documented in
# docs/admin/install.mdx, then pass both with `--env-file` to every Compose command.
# Requires Docker Compose 2.24.4 or newer for `include` and `!override`.
name: hephaestus

include:
  - path:
      - ../compose.proxy.yaml
      - ../compose.core.yaml
      - ../compose.app.yaml
      - ./compose.single-host.yaml
    project_directory: .
