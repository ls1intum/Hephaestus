# Resolves a merge request's global ID for summary and approval operations.

query GetMergeRequestGlobalId($fullPath: ID!, $iid: String!) {
    project(fullPath: $fullPath) {
        mergeRequest(iid: $iid) {
            id
            diffRefs {
                baseSha
                headSha
                startSha
            }
        }
    }
}
