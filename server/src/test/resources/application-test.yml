# Minimal test configuration for Spring Boot tests
spring:
    # Allow test configs to override production beans
    main:
        allow-bean-definition-overriding: true
    # Database configuration for tests (overridden by Testcontainers)
    datasource:
        # These values will be overridden by @DynamicPropertySource in test classes
        url: jdbc:postgresql://localhost:5432/test
        driver-class-name: org.postgresql.Driver
        username: test
        password: test
        # HikariCP configuration optimized for tests
        # Note: Pool size increased to handle REQUIRES_NEW nested transactions
        hikari:
            maximum-pool-size: 10
            minimum-idle: 2
            max-lifetime: 120000 # 2 minutes (shorter for faster cleanup)
            connection-timeout: 5000 # 5 seconds (fail fast)
            idle-timeout: 30000 # 30 seconds (faster cleanup)
            validation-timeout: 3000 # 3 seconds
            leak-detection-threshold: 5000 # 5 seconds for leak detection
            connection-test-query: SELECT 1

    # JPA configuration for tests
    # Use 'create' instead of 'create-drop': the Testcontainer is ephemeral so
    # DROP TABLE on shutdown is unnecessary.  With ~6 cached Spring contexts each
    # trying to DROP against the same container during JVM shutdown, the cumulative
    # connection-timeout delays exceed surefire's forkedProcessExitTimeoutInSeconds
    # (60 s), causing a "timeout in the fork" build failure.
    jpa:
        hibernate:
            ddl-auto: create
        show-sql: false

    # Test-specific configurations for faster shutdown
    task:
        execution:
            shutdown:
                await-termination: true
                await-termination-period: 5s

    # Disable liquibase for tests (use JPA auto DDL instead)
    liquibase:
        enabled: false

    # Security configuration for tests (minimal config)
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8081/realms/test

# Disable workspace bootstrapping during tests to prevent API calls
hephaestus:
    # Worker role off in tests: the worker capability is the Docker sandbox
    # (DockerSandboxConfiguration + AgentImagePullBootstrapper), which has no Docker daemon in
    # CI. Disabling the role keeps those beans out of the context — mentor beans still wire
    # (they're unconditional) and mock InteractiveSandboxService where they need it.
    runtime:
        worker:
            enabled: false
    evidence:
        authorized-source-uses: >-
            scm.pull-request.core:AUTOMATED_PRACTICE_ASSESSMENT,scm.pull-request.core:PRACTICE_FEEDBACK_DELIVERY,scm.pull-request.core:CONVERSATIONAL_MENTORING,scm.pull-request.core:OPERATOR_EVIDENCE_REVIEW,scm.pull-request.diff:AUTOMATED_PRACTICE_ASSESSMENT,scm.pull-request.diff:PRACTICE_FEEDBACK_DELIVERY,scm.pull-request.diff:CONVERSATIONAL_MENTORING,scm.pull-request.diff:OPERATOR_EVIDENCE_REVIEW,scm.pull-request.comments:AUTOMATED_PRACTICE_ASSESSMENT,scm.pull-request.comments:PRACTICE_FEEDBACK_DELIVERY,scm.pull-request.comments:CONVERSATIONAL_MENTORING,scm.pull-request.comments:OPERATOR_EVIDENCE_REVIEW,scm.repository.tree:AUTOMATED_PRACTICE_ASSESSMENT,scm.repository.tree:PRACTICE_FEEDBACK_DELIVERY,scm.repository.tree:CONVERSATIONAL_MENTORING,scm.repository.tree:OPERATOR_EVIDENCE_REVIEW,scm.issue.core:AUTOMATED_PRACTICE_ASSESSMENT,scm.issue.core:PRACTICE_FEEDBACK_DELIVERY,scm.issue.core:CONVERSATIONAL_MENTORING,scm.issue.core:OPERATOR_EVIDENCE_REVIEW,scm.issue.comments:AUTOMATED_PRACTICE_ASSESSMENT,scm.issue.comments:PRACTICE_FEEDBACK_DELIVERY,scm.issue.comments:CONVERSATIONAL_MENTORING,scm.issue.comments:OPERATOR_EVIDENCE_REVIEW,slack.conversation.thread:AUTOMATED_PRACTICE_ASSESSMENT,slack.conversation.thread:PRACTICE_FEEDBACK_DELIVERY,slack.conversation.thread:CONVERSATIONAL_MENTORING,slack.conversation.thread:OPERATOR_EVIDENCE_REVIEW,scm.linked-work-items:AUTOMATED_PRACTICE_ASSESSMENT,scm.linked-work-items:PRACTICE_FEEDBACK_DELIVERY,scm.linked-work-items:CONVERSATIONAL_MENTORING,scm.linked-work-items:OPERATOR_EVIDENCE_REVIEW,scm.review-threads:AUTOMATED_PRACTICE_ASSESSMENT,scm.review-threads:PRACTICE_FEEDBACK_DELIVERY,scm.review-threads:CONVERSATIONAL_MENTORING,scm.review-threads:OPERATOR_EVIDENCE_REVIEW,scm.general-review-comments:AUTOMATED_PRACTICE_ASSESSMENT,scm.general-review-comments:PRACTICE_FEEDBACK_DELIVERY,scm.general-review-comments:CONVERSATIONAL_MENTORING,scm.general-review-comments:OPERATOR_EVIDENCE_REVIEW,workspace.project-inventory:AUTOMATED_PRACTICE_ASSESSMENT,workspace.project-inventory:PRACTICE_FEEDBACK_DELIVERY,workspace.project-inventory:CONVERSATIONAL_MENTORING,workspace.project-inventory:OPERATOR_EVIDENCE_REVIEW,outline.documents:AUTOMATED_PRACTICE_ASSESSMENT,outline.documents:PRACTICE_FEEDBACK_DELIVERY,outline.documents:CONVERSATIONAL_MENTORING,outline.documents:OPERATOR_EVIDENCE_REVIEW
    # Loud enforcement under test: any unguarded scoped-table query throws.
    # Production runs in 'log' mode for the staging canary period; this override
    # ensures tenancy bugs surface in CI rather than being masked.
    tenancy:
        enforcement: throw
    security:
        # 32-char (256-bit) AES key for CredentialBundleConverter under test.
        # Encrypted credential blobs only persist when a key is configured; without
        # this, integration tests that go through ConnectionService.rotateBearerToken
        # fail at the boot stage where the converter requires a key.
        encryption-key: test-encryption-key-32-bytes-aes
    workspace:
        init-default: false # Disable PAT workspace bootstrap
        # Tests exercise creation mechanics as a regular user; the ADMIN_ONLY gate is covered
        # explicitly by WorkspaceCreationPolicyIntegrationTest via a property override.
        creation-policy: SELF_SERVICE
        # A5: keep the empty-membership ADMIN auto-seed OFF by default in tests (mirrors prod), so the
        # disabled-case test is deterministic. The enabled path is covered by a @TestPropertySource override.
        auto-seed-membership: false
    # OAuth state HMAC secret + webhook secret — required by HmacOAuthStateService
    # at boot. Without these the integration framework can't construct.
    integration:
        oauth-state:
            secret: test-oauth-state-hmac-secret-not-real
        # Suite-wide so GitLab @ConditionalOnProperty beans load in the base context — the GitLab
        # tests no longer need a per-class @TestPropertySource (which forked a context each).
        gitlab:
            enabled: true
            default-server-url: https://gitlab.lrz.de
    webhook:
        secret: test-webhook-shared-secret-not-real
        external-url: http://localhost:8080
    cors:
        allowed-origins:
            - http://localhost:4200
    webapp:
        url: http://localhost:4200
    # Sync configuration for tests
    sync:
        run-on-startup: false
        nats:
            enabled: false
            server: nats://localhost:4222
            replay-timeframe-days: 1
            durable-consumer-name: test-consumer
    fabric:
        root: /tmp/hephaestus-test-git-repos
    git:
        enabled: false
    practice-review:
        cooldown-minutes: 0

# Logging configuration for tests
logging:
    level:
        root: WARN
        de:
            tum:
                in:
                    www1:
                        hephaestus: INFO
