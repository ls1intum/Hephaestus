# Worker profile overlay — SPRING_PROFILES_ACTIVE=prod,worker.
spring:
    config:
        activate:
            on-profile: worker

    # Worker pod has no user-facing API. The Hephaestus JwtDecoder (core.auth) still wires
    # harmlessly, but we exclude Boot's resource-server autoconfig so a worker-only pod never
    # depends on user-auth wiring at boot.
    autoconfigure:
        exclude:
            - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

    main:
        web-application-type: servlet

    liquibase:
        enabled: false
    jpa:
        hibernate:
            ddl-auto: none
    lifecycle:
        timeout-per-shutdown-phase: 6m

server:
    # A real port, never -1: the actuator probe and the management endpoints answer on this one
    # connector, and disabling it leaves every bean wired while nothing can reach them. Loopback-bound,
    # so only in-container callers (thc) get there; sandboxes use the gateway connector instead.
    # No management.server.address belongs here: Spring Boot refuses a management-specific address
    # while the management endpoints share the server's port, which is the shipped topology.
    port: ${SERVER_PORT:8080}
    address: 127.0.0.1

hephaestus:
    runtime:
        server:
            enabled: false
        webhook:
            enabled: false
        worker:
            enabled: true

    sync:
        nats:
            enabled: false

    worker:
        control:
            endpoint: ${HEPHAESTUS_HUB_URL:}
            registration-token: ${HEPHAESTUS_WORKER_REGISTRATION_TOKEN:}
