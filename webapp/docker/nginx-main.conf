# The webapp server mode. Installed as /etc/nginx/nginx.conf, so the entrypoint's plain `nginx`
# starts it. The maintenance page is the other mode: nginx-maintenance.conf.

include /etc/nginx/hephaestus/globals.conf;

http {
    include /etc/nginx/hephaestus/http.conf;
    include /etc/nginx/conf.d/*.conf;
}
