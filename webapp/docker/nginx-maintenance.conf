# The maintenance server mode: `nginx -c /etc/nginx/hephaestus/maintenance.conf`. Traefik's
# maintenance service runs it from this image without the entrypoint, so it reads no runtime
# configuration and serves only the page baked into the image.

include /etc/nginx/hephaestus/globals.conf;

http {
    include /etc/nginx/hephaestus/http.conf;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/maintenance;

        # No per-request access line. This server answers on a catch-all Host rule
        # whenever the webapp router is down, so the URL it would log is the deep
        # link the contributor was trying to reach — and those name people
        # (/w/<slug>/user/<username>). Keeps the "no layer writes a per-request
        # IP/URL record" posture whole; error_log is untouched.
        access_log off;

        location / {
            rewrite ^ /index.html break;
        }
    }
}
