<svg xmlns="http://www.w3.org/2000/svg" width="360" height="490" viewBox="0 0 360 490" role="img" aria-labelledby="title description">
  <title id="title">Hephaestus feedback loop</title>
  <desc id="description">Gather project work, observe the engineering practices in it, compose useful feedback, deliver it in context, and let the developer respond.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#493C83"/>
    </marker>
  </defs>
  <path d="M305 440 C345 440 345 50 305 50" fill="none" stroke="#493C83" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(55 15)">
      <rect width="250" height="70" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
      <rect width="250" height="4" rx="2" fill="#493C83"/>
      <text x="125" y="31" text-anchor="middle" font-size="18" font-weight="600" fill="#1F2328">Gather</text>
      <text x="125" y="53" text-anchor="middle" font-size="13" fill="#59636E">project work</text>
    </g>
    <g transform="translate(55 110)">
      <rect width="250" height="70" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
      <rect width="250" height="4" rx="2" fill="#493C83"/>
      <text x="125" y="31" text-anchor="middle" font-size="18" font-weight="600" fill="#1F2328">Observe</text>
      <text x="125" y="53" text-anchor="middle" font-size="13" fill="#59636E">practices in it</text>
    </g>
    <g transform="translate(55 205)">
      <rect width="250" height="70" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
      <rect width="250" height="4" rx="2" fill="#493C83"/>
      <text x="125" y="31" text-anchor="middle" font-size="18" font-weight="600" fill="#1F2328">Compose</text>
      <text x="125" y="53" text-anchor="middle" font-size="13" fill="#59636E">useful feedback</text>
    </g>
    <g transform="translate(55 300)">
      <rect width="250" height="70" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
      <rect width="250" height="4" rx="2" fill="#493C83"/>
      <text x="125" y="31" text-anchor="middle" font-size="18" font-weight="600" fill="#1F2328">Deliver</text>
      <text x="125" y="53" text-anchor="middle" font-size="13" fill="#59636E">in context</text>
    </g>
    <g transform="translate(55 395)">
      <rect width="250" height="70" rx="12" fill="#493C83" stroke="#493C83"/>
      <text x="125" y="31" text-anchor="middle" font-size="18" font-weight="600" fill="#FFFFFF">Respond</text>
      <text x="125" y="53" text-anchor="middle" font-size="13" fill="#FFFFFF">act, push back, or pass</text>
    </g>
  </g>
  <g fill="none" stroke="#493C83" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M180 91 V103"/>
    <path d="M180 186 V198"/>
    <path d="M180 281 V293"/>
    <path d="M180 376 V388"/>
  </g>
</svg>
