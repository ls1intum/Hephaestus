<svg xmlns="http://www.w3.org/2000/svg" width="540" height="620" viewBox="0 0 540 620" role="img" aria-labelledby="title desc">
  <title id="title">The Hephaestus feedback loop</title>
  <desc id="desc">Gather project activity, observe engineering practices, compose clear feedback, deliver it in context, and let the developer respond. The response closes the loop.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2328" flood-opacity=".1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1l7 4-7 4" fill="none" stroke="#7d8590" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1l7 4-7 4" fill="none" stroke="#6e5aa7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g fill="none" stroke="#7d8590" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M250 109v18"/>
    <path d="M250 224v18"/>
    <path d="M250 339v18"/>
    <path d="M250 454v18"/>
  </g>
  <path d="M460 524h42V64h-38" fill="none" stroke="#6e5aa7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#loop-arrow)"/>

  <g filter="url(#shadow)">
    <rect x="40" y="20" width="420" height="89" rx="16" fill="#fff" stroke="#d0d7de"/>
    <rect x="40" y="135" width="420" height="89" rx="16" fill="#fff" stroke="#d0d7de"/>
    <rect x="40" y="250" width="420" height="89" rx="16" fill="#fff" stroke="#d0d7de"/>
    <rect x="40" y="365" width="420" height="89" rx="16" fill="#fff" stroke="#d0d7de"/>
    <rect x="40" y="480" width="420" height="89" rx="16" fill="#574584" stroke="#574584"/>
  </g>

  <g>
    <circle cx="86" cy="64" r="24" fill="#f0ebff" stroke="#d8cff2"/>
    <g transform="translate(74 52)" fill="none" stroke="#574584" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.7 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v4.1"/>
      <path d="m21 21-1.9-1.9"/>
      <circle cx="17" cy="17" r="3"/>
    </g>
    <text x="126" y="59" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Gather</text>
    <text x="126" y="83" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Project activity</text>
  </g>

  <g>
    <circle cx="86" cy="179" r="24" fill="#f0ebff" stroke="#d8cff2"/>
    <g transform="translate(74 167)" fill="none" stroke="#574584" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
      <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
      <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
      <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
      <circle cx="12" cy="12" r="3"/>
      <path d="m16 16-1.9-1.9"/>
    </g>
    <text x="126" y="174" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Observe</text>
    <text x="126" y="198" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Engineering practices</text>
  </g>

  <g>
    <circle cx="86" cy="294" r="24" fill="#f0ebff" stroke="#d8cff2"/>
    <g transform="translate(74 282)" fill="none" stroke="#574584" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 21h8"/>
      <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>
    </g>
    <text x="126" y="289" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Compose</text>
    <text x="126" y="313" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Clear, useful feedback</text>
  </g>

  <g>
    <circle cx="86" cy="409" r="24" fill="#f0ebff" stroke="#d8cff2"/>
    <g transform="translate(74 397)" fill="none" stroke="#574584" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/>
      <path d="m21.854 2.147-10.94 10.939"/>
    </g>
    <text x="126" y="404" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Deliver</text>
    <text x="126" y="428" fill="#59636e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">In context</text>
  </g>

  <g>
    <circle cx="86" cy="524" r="24" fill="#6e5aa7" stroke="#8f7bc6"/>
    <g transform="translate(74 512)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/>
      <path d="m10 15-3-3 3-3"/>
      <path d="M7 12h8a2 2 0 0 1 2 2v1"/>
    </g>
    <text x="126" y="519" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Respond</text>
    <text x="126" y="543" fill="#eee9ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Act, push back, or pass</text>
  </g>

  <rect x="175" y="584" width="190" height="28" rx="14" fill="#f6f3ff" stroke="#d8cff2"/>
  <text x="270" y="603" fill="#574584" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Response closes the loop</text>
</svg>
