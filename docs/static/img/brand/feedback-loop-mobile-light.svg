<svg xmlns="http://www.w3.org/2000/svg" width="340" height="825" viewBox="0 0 340 825" role="img" aria-labelledby="title desc">
  <title id="title">How Hephaestus turns project work into practice feedback</title>
  <desc id="desc">Project work and its context go to Hephaestus, which reviews the work against the workspace's practices. Feedback explains what worked, what could improve, and what to try next. It can appear alongside the work, in a private view, or in conversation with Heph. The developer decides whether to use, question, or skip it before continuing with their next project work.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .surface { fill: #fff; stroke: #d0d7de; }
    .layer { fill: #f6f3ff; stroke: #d8cff2; }
    .feedback { fill: #f6f3ff; stroke: #a994d8; }
    .choice { fill: #fff; stroke: #a994d8; }
    .title { fill: #1f2328; font-size: 17px; font-weight: 700; }
    .body { fill: #59636e; font-size: 15px; }
    .small { fill: #59636e; font-size: 14px; }
    .eyebrow { fill: #574584; font-size: 12.5px; font-weight: 700; letter-spacing: .6px; }
    .number { fill: #fff; font-size: 12px; font-weight: 700; text-anchor: middle; }
    .icon { fill: none; stroke: #574584; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: #7b68ae; stroke-width: 2.5; stroke-linecap: round; }
  </style>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2328" flood-opacity=".1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1.5 10 6l-8 4.5" fill="none" stroke="#7b68ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <path class="flow" d="M170 150v17" marker-end="url(#arrow)"/>
  <path class="flow" d="M170 316v20" marker-end="url(#arrow)"/>
  <path class="flow" d="M170 625v20" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="28" y="12" width="296" height="126" rx="18" class="layer"/>
    <rect x="22" y="18" width="296" height="126" rx="18" class="layer"/>
    <rect x="16" y="24" width="308" height="126" rx="18" class="surface"/>
  </g>
  <circle cx="42" cy="51" r="15" fill="#574584"/>
  <text x="42" y="55" class="number">1</text>
  <text x="64" y="57" class="title">Your project work</text>
  <text x="42" y="82" class="body">With the context around it</text>
  <g transform="translate(42 96)">
    <rect width="256" height="35" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <g class="icon" transform="translate(10 6) scale(.85)">
      <path d="m8 8-4 4 4 4"/>
      <path d="m16 8 4 4-4 4"/>
      <path d="m14 4-4 16"/>
    </g>
    <path d="M71 9v17M127 9v17M183 9v17" stroke="#d0d7de"/>
    <g class="icon" transform="translate(84 6) scale(.85)">
      <path d="M4 12.5 9 17l11-11"/>
    </g>
    <path d="M145 8h17a6 6 0 0 1 6 6v3a6 6 0 0 1-6 6h-5l-6 6v-6h-6a6 6 0 0 1-6-6v-3a6 6 0 0 1 6-6Z" fill="#eee9ff" stroke="#a994d8"/>
    <g class="icon" transform="translate(205 6) scale(.85)">
      <path d="M6 2h9l5 5v15H6z"/>
      <path d="M14 2v6h6M9 13h8M9 17h6"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="16" y="176" width="308" height="140" rx="20" class="surface"/>
  </g>
  <circle cx="42" cy="203" r="15" fill="#574584"/>
  <text x="42" y="207" class="number">2</text>
  <text x="64" y="209" class="title">Hephaestus reviews the work</text>
  <text x="42" y="236" class="body">Against your workspace's practices</text>
  <g transform="translate(42 258)">
    <rect width="94" height="38" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="47" y="24" class="small" text-anchor="middle">Evidence</text>
    <circle cx="118" cy="19" r="13" fill="#fff" stroke="#d0d7de"/>
    <text x="118" y="24" class="title" text-anchor="middle">+</text>
    <rect x="144" width="110" height="38" rx="12" fill="#eee9ff" stroke="#a994d8"/>
    <text x="199" y="24" class="small" text-anchor="middle">Practice</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="16" y="345" width="308" height="280" rx="20" class="feedback"/>
  </g>
  <circle cx="42" cy="372" r="15" fill="#574584"/>
  <text x="42" y="376" class="number">3</text>
  <text x="64" y="369" class="eyebrow">PRACTICE FEEDBACK</text>
  <text x="64" y="393" class="title">Feedback reaches you</text>
  <g transform="translate(42 414)">
    <circle cx="10" cy="10" r="9" fill="#fff" stroke="#a994d8"/>
    <path d="m6 10 3 3 6-7" class="icon"/>
    <text x="30" y="15" class="body">What worked</text>

    <circle cx="10" cy="43" r="9" fill="#fff" stroke="#a994d8"/>
    <path d="M6 47 15 38M10 38h5v5" class="icon"/>
    <text x="30" y="48" class="body">What could improve</text>

    <circle cx="10" cy="76" r="9" fill="#fff" stroke="#a994d8"/>
    <path d="M6 76h9M11 72l4 4-4 4" class="icon"/>
    <text x="30" y="81" class="body">What to try next</text>
  </g>
  <path d="M42 510h256" stroke="#c9bfe3"/>
  <text x="42" y="535" class="eyebrow">WHERE FEEDBACK CAN APPEAR</text>
  <g transform="translate(30 548)">
    <rect width="132" height="34" rx="17" fill="#fff" stroke="#b8a8df"/>
    <text x="66" y="22" class="small" text-anchor="middle">Alongside the work</text>
    <rect x="140" width="140" height="34" rx="17" fill="#fff" stroke="#b8a8df"/>
    <text x="210" y="22" class="small" text-anchor="middle">In your private view</text>
    <rect x="94" y="42" width="94" height="34" rx="17" fill="#fff" stroke="#b8a8df"/>
    <text x="141" y="64" class="small" text-anchor="middle">With Heph</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="16" y="655" width="308" height="115" rx="20" class="choice"/>
  </g>
  <circle cx="42" cy="682" r="15" fill="#574584"/>
  <text x="42" y="686" class="number">4</text>
  <text x="64" y="679" class="eyebrow">YOU STAY IN CHARGE</text>
  <text x="64" y="704" class="title">You decide what helps</text>
  <g transform="translate(42 720)">
    <rect width="67" height="31" rx="15.5" fill="#eee9ff" stroke="#b8a8df"/>
    <text x="33.5" y="20" class="small" text-anchor="middle">Use it</text>
    <rect x="76" width="92" height="31" rx="15.5" fill="#eee9ff" stroke="#b8a8df"/>
    <text x="122" y="20" class="small" text-anchor="middle">Question it</text>
    <rect x="177" width="78" height="31" rx="15.5" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="216" y="20" class="small" text-anchor="middle">Skip it</text>
  </g>

  <path d="M170 770v2c0 8-6 14-14 14H64" class="flow" marker-end="url(#arrow)"/>
  <path d="M48 798a13 13 0 1 1-4-11" class="flow"/>
  <path d="m43 786 2 9 8-4Z" fill="#7b68ae"/>
  <text x="70" y="813" class="eyebrow">NEXT PROJECT WORK</text>
</svg>
