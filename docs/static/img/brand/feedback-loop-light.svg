<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc">
  <title id="title">How Hephaestus turns project work into practice feedback</title>
  <desc id="desc">Project work and its context go to Hephaestus, which reviews the work against the workspace's practices. Feedback explains what worked, what could improve, and what to try next. It can appear alongside the work, in a private view, or in conversation with Heph. The developer decides whether to use, question, or skip it before continuing with their next project work.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .surface { fill: #fff; stroke: #d0d7de; }
    .layer { fill: #f6f3ff; stroke: #d8cff2; }
    .feedback { fill: #f6f3ff; stroke: #a994d8; }
    .choice { fill: #fff; stroke: #a994d8; }
    .title { fill: #1f2328; font-size: 20px; font-weight: 700; }
    .body { fill: #59636e; font-size: 18px; }
    .small { fill: #59636e; font-size: 16px; }
    .eyebrow { fill: #574584; font-size: 15px; font-weight: 700; letter-spacing: .7px; }
    .return { fill: #574584; font-size: 16px; font-weight: 700; letter-spacing: .8px; }
    .number { fill: #fff; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .icon { fill: none; stroke: #574584; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .flow { fill: none; stroke: #7b68ae; stroke-width: 3; stroke-linecap: round; }
  </style>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1f2328" flood-opacity=".1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1.5 10 6l-8 4.5" fill="none" stroke="#7b68ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- One continuous story: project work → review → feedback → developer choice → next work. -->
  <path class="flow" d="M280 195h42" marker-end="url(#arrow)"/>
  <path class="flow" d="M625 195h42" marker-end="url(#arrow)"/>
  <path class="flow" d="M1080 260c48 40 35 135-71 205" marker-end="url(#arrow)"/>
  <path class="flow" d="M460 478C302 548 90 532 65 311" marker-end="url(#arrow)"/>
  <text x="205" y="563" class="return" text-anchor="middle">NEXT PROJECT WORK</text>

  <!-- 1. Project work: layered artifacts rather than another generic process card. -->
  <g filter="url(#shadow)">
    <rect x="52" y="68" width="228" height="210" rx="18" class="layer"/>
    <rect x="41" y="79" width="228" height="210" rx="18" class="layer"/>
    <rect x="30" y="90" width="250" height="210" rx="18" class="surface"/>
  </g>
  <circle cx="56" cy="116" r="17" fill="#574584"/>
  <text x="56" y="121" class="number">1</text>
  <text x="82" y="122" class="title">Your project work</text>
  <text x="55" y="154" class="body">With the context around it</text>
  <g transform="translate(58 184)">
    <rect width="190" height="82" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <rect x="8" y="13" width="35" height="56" rx="9" fill="#fff" stroke="#d0d7de"/>
    <g class="icon" transform="translate(13 29) scale(.78)">
      <path d="m8 8-4 4 4 4"/>
      <path d="m16 8 4 4-4 4"/>
      <path d="m14 4-4 16"/>
    </g>
    <rect x="54" y="13" width="35" height="56" rx="9" fill="#fff" stroke="#d0d7de"/>
    <g class="icon" transform="translate(60 31) scale(.75)">
      <path d="M4 12.5 9 17l11-11"/>
    </g>
    <rect x="100" y="13" width="35" height="56" rx="9" fill="#fff" stroke="#d0d7de"/>
    <path d="M108 28h18a6 6 0 0 1 6 6v5a6 6 0 0 1-6 6h-5l-6 6v-6h-7a6 6 0 0 1-6-6v-5a6 6 0 0 1 6-6Z" fill="#eee9ff" stroke="#a994d8"/>
    <rect x="146" y="13" width="35" height="56" rx="9" fill="#fff" stroke="#d0d7de"/>
    <g class="icon" transform="translate(153 29) scale(.72)">
      <path d="M6 2h9l5 5v15H6z"/>
      <path d="M14 2v6h6M9 13h8M9 17h6"/>
    </g>
  </g>

  <!-- 2. Hephaestus: evidence is considered against the workspace's practices. -->
  <g filter="url(#shadow)">
    <rect x="335" y="83" width="290" height="217" rx="22" class="surface"/>
  </g>
  <circle cx="362" cy="110" r="17" fill="#574584"/>
  <text x="362" y="115" class="number">2</text>
  <text x="388" y="113" class="title">Hephaestus reviews</text>
  <text x="388" y="138" class="title">the work</text>
  <text x="362" y="172" class="body">Against your workspace's</text>
  <text x="362" y="194" class="body">engineering practices</text>
  <g transform="translate(362 222)">
    <rect width="94" height="46" rx="13" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="47" y="29" class="small" text-anchor="middle">Evidence</text>
    <circle cx="118" cy="23" r="14" fill="#fff" stroke="#d0d7de"/>
    <text x="118" y="29" class="title" font-size="18" text-anchor="middle">+</text>
    <rect x="144" width="110" height="46" rx="13" fill="#eee9ff" stroke="#a994d8"/>
    <text x="199" y="29" class="small" text-anchor="middle">Practice</text>
  </g>

  <!-- 3. The output is the focal point: useful feedback and multiple delivery surfaces. -->
  <g filter="url(#shadow)">
    <rect x="670" y="46" width="410" height="332" rx="22" class="feedback"/>
  </g>
  <circle cx="698" cy="75" r="17" fill="#574584"/>
  <text x="698" y="80" class="number">3</text>
  <text x="724" y="72" class="eyebrow">PRACTICE FEEDBACK</text>
  <text x="724" y="99" class="title">Feedback reaches you</text>
  <g transform="translate(698 123)">
    <circle cx="12" cy="12" r="11" fill="#fff" stroke="#a994d8"/>
    <path d="m7 12 3 3 7-7" class="icon"/>
    <text x="34" y="17" class="body">What worked</text>

    <circle cx="12" cy="52" r="11" fill="#fff" stroke="#a994d8"/>
    <path d="M7 57 17 47M11 47h6v6" class="icon"/>
    <text x="34" y="57" class="body">What could improve</text>

    <circle cx="12" cy="92" r="11" fill="#fff" stroke="#a994d8"/>
    <path d="M7 92h10M13 88l4 4-4 4" class="icon"/>
    <text x="34" y="97" class="body">What to try next</text>
  </g>
  <path d="M698 235h354" stroke="#c9bfe3"/>
  <text x="698" y="262" class="eyebrow">WHERE FEEDBACK CAN APPEAR</text>
  <g transform="translate(698 280)">
    <rect width="142" height="36" rx="18" fill="#fff" stroke="#b8a8df"/>
    <text x="71" y="23" class="small" text-anchor="middle">Alongside the work</text>
    <rect x="150" width="142" height="36" rx="18" fill="#fff" stroke="#b8a8df"/>
    <text x="221" y="23" class="small" text-anchor="middle">In your private view</text>
    <rect x="103" y="44" width="94" height="36" rx="18" fill="#fff" stroke="#b8a8df"/>
    <text x="150" y="67" class="small" text-anchor="middle">With Heph</text>
  </g>

  <!-- 4. The human decision uses a different visual grammar from the system stages. -->
  <g filter="url(#shadow)">
    <rect x="460" y="420" width="550" height="120" rx="22" class="choice"/>
  </g>
  <circle cx="492" cy="453" r="18" fill="#574584"/>
  <text x="492" y="458" class="number">4</text>
  <text x="521" y="448" class="eyebrow">YOU STAY IN CHARGE</text>
  <text x="521" y="477" class="title">You decide what helps</text>
  <g transform="translate(521 493)">
    <rect width="64" height="34" rx="17" fill="#eee9ff" stroke="#b8a8df"/>
    <text x="32" y="22" class="small" text-anchor="middle">Use it</text>
    <rect x="72" width="88" height="34" rx="17" fill="#eee9ff" stroke="#b8a8df"/>
    <text x="116" y="22" class="small" text-anchor="middle">Question it</text>
    <rect x="168" width="76" height="34" rx="17" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="206" y="22" class="small" text-anchor="middle">Skip it</text>
  </g>
</svg>
