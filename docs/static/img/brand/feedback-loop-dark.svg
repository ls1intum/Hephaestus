<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="150" viewBox="0 0 1080 150" role="img" aria-labelledby="title description">
  <title id="title">Hephaestus feedback loop</title>
  <desc id="description">Gather project work, observe the engineering practices in it, compose useful feedback, deliver it in context, and let the developer respond.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9475DB"/>
    </marker>
  </defs>
  <path d="M973 52 C973 13 97 13 97 52" fill="none" stroke="#9475DB" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(10 52)">
      <rect width="174" height="78" rx="12" fill="#161B22" stroke="#30363D"/>
      <rect width="174" height="4" rx="2" fill="#9475DB"/>
      <text x="87" y="33" text-anchor="middle" font-size="18" font-weight="600" fill="#F0F6FC">Gather</text>
      <text x="87" y="56" text-anchor="middle" font-size="13" fill="#8B949E">project work</text>
    </g>
    <g transform="translate(229 52)">
      <rect width="174" height="78" rx="12" fill="#161B22" stroke="#30363D"/>
      <rect width="174" height="4" rx="2" fill="#9475DB"/>
      <text x="87" y="33" text-anchor="middle" font-size="18" font-weight="600" fill="#F0F6FC">Observe</text>
      <text x="87" y="56" text-anchor="middle" font-size="13" fill="#8B949E">practices in it</text>
    </g>
    <g transform="translate(448 52)">
      <rect width="174" height="78" rx="12" fill="#161B22" stroke="#30363D"/>
      <rect width="174" height="4" rx="2" fill="#9475DB"/>
      <text x="87" y="33" text-anchor="middle" font-size="18" font-weight="600" fill="#F0F6FC">Compose</text>
      <text x="87" y="56" text-anchor="middle" font-size="13" fill="#8B949E">useful feedback</text>
    </g>
    <g transform="translate(667 52)">
      <rect width="174" height="78" rx="12" fill="#161B22" stroke="#30363D"/>
      <rect width="174" height="4" rx="2" fill="#9475DB"/>
      <text x="87" y="33" text-anchor="middle" font-size="18" font-weight="600" fill="#F0F6FC">Deliver</text>
      <text x="87" y="56" text-anchor="middle" font-size="13" fill="#8B949E">in context</text>
    </g>
    <g transform="translate(886 52)">
      <rect width="174" height="78" rx="12" fill="#493C83" stroke="#9475DB"/>
      <text x="87" y="33" text-anchor="middle" font-size="18" font-weight="600" fill="#FFFFFF">Respond</text>
      <text x="87" y="56" text-anchor="middle" font-size="13" fill="#FFFFFF">act, push back, or pass</text>
    </g>
  </g>
  <g fill="none" stroke="#9475DB" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M195 91 H218"/>
    <path d="M414 91 H437"/>
    <path d="M633 91 H656"/>
    <path d="M852 91 H875"/>
  </g>
</svg>
