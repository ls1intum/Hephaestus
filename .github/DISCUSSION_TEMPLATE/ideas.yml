body:
  - type: markdown
    attributes:
      value: |
        Search [existing ideas](https://github.com/hephaestus-build/Hephaestus/discussions/categories/ideas) before starting a discussion.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain who encounters the problem, what they are trying to accomplish, and why the current experience falls short.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a good outcome look like?
      description: Describe the result and its value.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and context
      description: Share relevant workarounds, alternatives, constraints, or links.
