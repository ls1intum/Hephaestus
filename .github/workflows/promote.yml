# Hosts trust this workflow's signing identity. Keep signing behind the environment gate;
# making this workflow reusable would let callers share that identity.
name: Promote
run-name: Promote ${{ inputs.release || inputs.commit }} to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to move
        type: choice
        options: [Staging, Production]
        required: true
      release:
        description: Release to run, as vX.Y.Z. Leave empty to follow a commit instead.
        type: string
        required: false
      commit:
        description: Commit to run, as a full SHA. Only for an environment that follows main.
        type: string
        required: false
      automatic:
        description: Follow main only if the channel is not frozen or ahead of this build
        type: boolean
        default: false
      allow-rollback:
        description: Permit moving this environment backwards
        type: boolean
        default: false
      freeze:
        description: Hold the environment where it is and ignore this release
        type: boolean
        default: false
permissions: {}

concurrency:
  group: promote-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  automatic:
    if: ${{ inputs.automatic }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      apply: ${{ steps.policy.outputs.apply }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: deploy-state
          path: deploy-state
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "none"
      # The workflow lock covers this read through publication, including manually requested holds.
      - name: Check automatic promotion
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
          CHANNEL: ${{ inputs.environment }}
        run: node scripts/automatic-promotion.ts

  promote:
    needs: automatic
    if: ${{ !cancelled() && !failure() && (!inputs.automatic || needs.automatic.outputs.apply == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      # APP_HOSTNAME is environment-scoped, so resolve it after the job starts.
      url: ${{ steps.release.outputs.environment_url }}
    permissions:
      contents: write
      id-token: write
    steps:
      # Tooling comes from the dispatched workflow ref, not from the deployment target.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: deploy-state
          path: deploy-state
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          install: "none"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Unlike tooling, upstream image pins must come from the deployment target.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ inputs.commit != '' }}
        with:
          ref: ${{ inputs.commit }}
          path: .promotion-inventory
          sparse-checkout: security
          persist-credentials: false

      - name: Resolve the release to promote
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.release }}
          HOSTNAME: ${{ vars.APP_HOSTNAME }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          echo "environment_url=https://${HOSTNAME}" >> "$GITHUB_OUTPUT"

          if [ -n "$COMMIT" ]; then
            [ -z "$REQUESTED" ] || {
              echo "::error::Name a release or a commit, not both"; exit 1; }
            [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::Follow a full commit SHA, not '$COMMIT'"; exit 1; }
            # Dispatch permission must not authorize commits outside main.
            gh api "repos/$GITHUB_REPOSITORY/compare/$COMMIT...main" --jq .status |
              grep -qE '^(identical|ahead)$' || {
                echo "::error::$COMMIT is not on the default branch"; exit 1; }
            echo "release=$COMMIT" >> "$GITHUB_OUTPUT"
            echo "version=$COMMIT" >> "$GITHUB_OUTPUT"
            echo "follows=commit" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release="$REQUESTED"
          [[ "$release" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::Promote an immutable vX.Y.Z release, not '$release'"; exit 1; }
          # The host binds the tag's source tree to the signed release lock before applying it.
          [ "$(gh release view "$release" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false ] || {
            echo "::error::$release is still a draft"; exit 1; }
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=${release#v}" >> "$GITHUB_OUTPUT"
          echo "follows=release" >> "$GITHUB_OUTPUT"

      - name: Write and sign the channel
        working-directory: deploy-state
        env:
          CHANNEL: ${{ inputs.environment }}
          RELEASE: ${{ steps.release.outputs.release }}
          FOLLOWS: ${{ steps.release.outputs.follows }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
          ALLOW_ROLLBACK: ${{ inputs.allow-rollback || false }}
          FREEZE: ${{ inputs.freeze || false }}
        run: |
          set -euo pipefail
          channel=$(echo "$CHANNEL" | tr '[:upper:]' '[:lower:]')
          mkdir -p channels
          if [ "$FOLLOWS" = commit ]; then
            # Commit deployments carry verified image digests in the signed channel.
            node "$GITHUB_WORKSPACE/scripts/commit-image-lock.ts" \
              "$RELEASE" "$OWNER" "$GITHUB_WORKSPACE/.promotion-inventory/security/release-images.json" \
              > images.json
            jq -n --arg commit "$RELEASE" --slurpfile images images.json \
              --argjson allowRollback "$ALLOW_ROLLBACK" --argjson freeze "$FREEZE" \
              '{commit: $commit, images: $images[0], allowRollback: $allowRollback, freeze: $freeze}' \
              > "channels/${channel}.json"
            rm -f images.json
          else
            jq -n --arg release "$RELEASE" --argjson allowRollback "$ALLOW_ROLLBACK" \
              --argjson freeze "$FREEZE" \
              '{release: $release, allowRollback: $allowRollback, freeze: $freeze}' \
              > "channels/${channel}.json"
          fi
          cosign sign-blob --yes \
            --bundle "channels/${channel}.json.sigstore.json" \
            "channels/${channel}.json"
          echo "CHANNEL_FILE=channels/${channel}.json" >> "$GITHUB_ENV"

      - name: Publish the channel
        working-directory: deploy-state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          node ../scripts/commit-via-api.ts \
            --branch deploy-state \
            --message "chore(deploy): ${CHANNEL_FILE} -> ${RELEASE}" \
            -- channels

      - name: Wait for the environment to converge
        if: ${{ !inputs.freeze }}
        env:
          EXPECTED: ${{ steps.release.outputs.version }}
          HOSTNAME: ${{ vars.APP_HOSTNAME }}
        run: |
          set -euo pipefail
          # Observe the public webapp version; host metrics report stack readiness separately.
          deadline=$(( SECONDS + 900 ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            config=$(curl -fsS --max-time 20 "https://${HOSTNAME}/" |
              grep -oE '/env-config\.[a-f0-9]{8}\.js' | head -1 || true)
            if [ -n "$config" ]; then
              running=$(curl -fsS --max-time 20 "https://${HOSTNAME}${config}" |
                sed -nE 's/.*APPLICATION_VERSION: "([^"]*)".*/\1/p' | head -1 || true)
              [ "$running" = "$EXPECTED" ] && { echo "Converged on $running"; exit 0; }
            fi
            sleep 20
          done
          echo "::error::${HOSTNAME} did not reach ${EXPECTED} within 15 minutes"
          exit 1
