# Moves an environment to a release by writing its channel on `deploy-state`, which the hosts poll.
#
# The hosts pin this workflow's identity, and a GitHub environment gates it, so a signature carrying
# that identity is proof its reviewers approved. That holds only while this workflow stays
# non-reusable: a `workflow_call` trigger would let any caller mint the same identity. The release
# reaches staging by dispatching this workflow, not by triggering on its completion, so no run here
# inherits a context it did not ask for.
name: Promote
run-name: Promote ${{ inputs.release }} to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to move
        type: choice
        options: [Staging, Production]
        required: true
      release:
        description: Release to run, as vX.Y.Z. Leave empty to follow a commit instead.
        type: string
        required: false
      commit:
        description: Commit to run, as a full SHA. Only for an environment that follows main.
        type: string
        required: false
      allow-rollback:
        description: Permit moving this environment backwards
        type: boolean
        default: false
      freeze:
        description: Hold the environment where it is and ignore this release
        type: boolean
        default: false
permissions: {}

concurrency:
  group: promote-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      # GitHub records this as the deployment's environment_url, on the status it writes when the
      # job ends. A status posted from inside the job would be superseded by that one, so the URL
      # has to come from here rather than from a step. It is a step output because APP_HOSTNAME is
      # scoped to the environment being resolved.
      url: ${{ steps.release.outputs.environment_url }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: deploy-state
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # deploy-state carries channels, not code, so the image resolver comes from the default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit being promoted, so the upstream pins and the resolver are the ones that
          # commit carries. An empty ref is the default branch, which is what a release wants.
          ref: ${{ inputs.commit }}
          path: .promotion-scripts
          sparse-checkout: |
            scripts
            security
          persist-credentials: false

      - name: Resolve the release to promote
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.release }}
          HOSTNAME: ${{ vars.APP_HOSTNAME }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          echo "environment_url=https://${HOSTNAME}" >> "$GITHUB_OUTPUT"

          if [ -n "$COMMIT" ]; then
            [ -z "$REQUESTED" ] || {
              echo "::error::Name a release or a commit, not both"; exit 1; }
            [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::Follow a full commit SHA, not '$COMMIT'"; exit 1; }
            # Only what is already on the default branch may be followed: a commit that is not an
            # ancestor of main has not been through review, whoever is able to dispatch this.
            gh api "repos/$GITHUB_REPOSITORY/compare/$COMMIT...main" --jq .status |
              grep -qE '^(identical|ahead)$' || {
                echo "::error::$COMMIT is not on the default branch"; exit 1; }
            echo "release=$COMMIT" >> "$GITHUB_OUTPUT"
            echo "version=$COMMIT" >> "$GITHUB_OUTPUT"
            echo "follows=commit" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release="$REQUESTED"
          [[ "$release" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::Promote an immutable vX.Y.Z release, not '$release'"; exit 1; }
          # GitHub tag immutability is not a gate here: the host takes the source commit and every
          # image digest from the cosign-signed release lock, so a moved tag changes nothing that is
          # deployed. Requiring it would refuse the older releases a rollback exists to reach.
          [ "$(gh release view "$release" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false ] || {
            echo "::error::$release is still a draft"; exit 1; }
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=${release#v}" >> "$GITHUB_OUTPUT"
          echo "follows=release" >> "$GITHUB_OUTPUT"

      - name: Write and sign the channel
        env:
          CHANNEL: ${{ inputs.environment }}
          RELEASE: ${{ steps.release.outputs.release }}
          FOLLOWS: ${{ steps.release.outputs.follows }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
          ALLOW_ROLLBACK: ${{ inputs.allow-rollback || false }}
          FREEZE: ${{ inputs.freeze || false }}
        run: |
          set -euo pipefail
          channel=$(echo "$CHANNEL" | tr '[:upper:]' '[:lower:]')
          mkdir -p channels
          if [ "$FOLLOWS" = commit ]; then
            # A commit has no release to fetch a lock from, so the channel carries the digests
            # itself. They are covered by the signature below, which is the same authority that
            # stands behind a release lock.
            node .promotion-scripts/scripts/commit-image-lock.ts "$RELEASE" "$OWNER" > images.json
            jq -n --arg commit "$RELEASE" --slurpfile images images.json \
              --argjson allowRollback "$ALLOW_ROLLBACK" --argjson freeze "$FREEZE" \
              '{commit: $commit, images: $images[0], allowRollback: $allowRollback, freeze: $freeze}' \
              > "channels/${channel}.json"
            rm -f images.json
          else
            jq -n --arg release "$RELEASE" --argjson allowRollback "$ALLOW_ROLLBACK" \
              --argjson freeze "$FREEZE" \
              '{release: $release, allowRollback: $allowRollback, freeze: $freeze}' \
              > "channels/${channel}.json"
          fi
          cosign sign-blob --yes \
            --bundle "channels/${channel}.json.sigstore.json" \
            "channels/${channel}.json"
          echo "CHANNEL_FILE=channels/${channel}.json" >> "$GITHUB_ENV"

      - name: Publish the channel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels
          # An empty commit would read as a move forward to hosts that compare ancestry.
          git diff --cached --quiet && { echo "Channel already at $RELEASE"; exit 0; }
          git commit -m "chore(deploy): ${CHANNEL_FILE} -> ${RELEASE}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:deploy-state

      - name: Wait for the environment to converge
        if: ${{ !inputs.freeze }}
        env:
          EXPECTED: ${{ steps.release.outputs.version }}
          HOSTNAME: ${{ vars.APP_HOSTNAME }}
        run: |
          set -euo pipefail
          # Nothing here can push the hosts, so the deploy is observed: the webapp publishes the
          # version it runs, which makes convergence visible without any access to the host.
          deadline=$(( SECONDS + 900 ))
          while [ "$SECONDS" -lt "$deadline" ]; do
            config=$(curl -fsS --max-time 20 "https://${HOSTNAME}/" |
              grep -oE '/env-config\.[a-f0-9]{8}\.js' | head -1 || true)
            if [ -n "$config" ]; then
              running=$(curl -fsS --max-time 20 "https://${HOSTNAME}${config}" |
                sed -nE 's/.*APPLICATION_VERSION: "([^"]*)".*/\1/p' | head -1 || true)
              [ "$running" = "$EXPECTED" ] && { echo "Converged on $running"; exit 0; }
            fi
            sleep 20
          done
          echo "::error::${HOSTNAME} did not reach ${EXPECTED} within 15 minutes"
          exit 1
