name: Qualify Bun lockfile
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      - "docs/package.json"
      - "webapp/package.json"
      - "scripts/check-package-manager.ts"
      - "scripts/qualify-bun-lockfile.sh"
      - ".github/actions/setup-bun/action.yml"
      - ".github/workflows/qualify-bun-lockfile.yml"
      - "docker/agents/pi/Dockerfile"
      - "webapp/Dockerfile"
      - "patches/**"
permissions:
  contents: read
concurrency:
  group: bun-lockfile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  deterministic-install:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - run: scripts/qualify-bun-lockfile.sh 25
