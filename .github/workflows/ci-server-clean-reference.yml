name: Server Clean Reference

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 2"

permissions:
  contents: read

concurrency:
  group: server-clean-reference
  cancel-in-progress: false

jobs:
  verify:
    name: Clean uncached server verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "server/**/pom.xml"

      - name: Run clean unit tests
        working-directory: server
        run: ./mvnw clean test -pl application -am -Dmaven.build.cache.enabled=false -Dsurefire.includedGroups=unit -DskipCoverage=false --batch-mode

      - name: Run architecture tests
        working-directory: server
        run: ./mvnw test -pl application -am -Dmaven.build.cache.enabled=false -Parchitecture-tests --batch-mode

      - name: Run integration tests
        working-directory: server
        run: ./mvnw test -pl application -am -Dmaven.build.cache.enabled=false -Dsurefire.includedGroups=integration -Dparallel=none --batch-mode
