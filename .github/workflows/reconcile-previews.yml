name: Preview reconcile

# Event-driven cleanup can be missed — a run cancelled, a Coolify hiccup, a pull request closed while
# the lifecycle queue was busy. This sweeps what the events left behind, and joins the same global
# lifecycle group as deploy and close so admission cannot race reclamation.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: preview-reconcile-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: "Preview / Inventory"
    if: vars.COOLIFY_URL != '' && vars.COOLIFY_APP_UUID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    timeout-minutes: 5
    outputs:
      previews: ${{ steps.candidates.outputs.previews }}
    steps:
      - name: Find the preview environments GitHub still records
        id: candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidates="${RUNNER_TEMP}/preview-candidates.txt"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/deployments?task=deploy%3Apreview&per_page=100" \
            --jq '.[] | .environment | select(test("^preview/pr-[1-9][0-9]*$")) | sub("^preview/pr-"; "")' \
            | sort -nu > "${candidates}"

          count=$(grep -c . "${candidates}" || true)
          # Truncate rather than abort: a backlog past the bound is exactly when this job is needed,
          # so refusing to run would make the next night's backlog larger still.
          if [ "${count}" -gt 100 ]; then
            echo "::warning::Found ${count} preview candidates; reconciling the oldest 100 this run."
            head -100 "${candidates}" > "${candidates}.capped"
            mv "${candidates}.capped" "${candidates}"
          fi
          previews=$(jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)' "${candidates}")
          echo "previews=${previews}" >> "${GITHUB_OUTPUT}"
          echo "Found ${count} preview candidates."

  cleanup:
    name: "Preview / Reconcile PR ${{ matrix.pr }}"
    needs: inventory
    if: needs.inventory.result == 'success' && needs.inventory.outputs.previews != '[]'
    permissions:
      contents: read
      deployments: write
      pull-requests: read
    strategy:
      fail-fast: false
      # Every job below joins the global preview lifecycle group, so a higher value would only start
      # runners that immediately queue.
      max-parallel: 1
      matrix:
        pr: ${{ fromJSON(needs.inventory.outputs.previews) }}
    concurrency:
      group: hephaestus-preview-lifecycle
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
      PR_NUMBER: ${{ matrix.pr }}
      ENVIRONMENT: preview/pr-${{ matrix.pr }}
    steps:
      - name: Load the trusted preview adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-bun
            package.json
            scripts

      - name: Set up the repository's Bun version
        uses: ./.github/actions/setup-bun

      - name: Recheck pull request state
        id: pull
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const controller = await import(`${process.env.GITHUB_WORKSPACE}/scripts/preview-controller.ts`);
            await controller.assess({ github, context, core });

      - name: Request Coolify cleanup through the signed close event
        id: close
        if: steps.pull.outputs.stale == 'true'
        env:
          COOLIFY_WEBHOOK_SECRET: ${{ secrets.COOLIFY_PREVIEW_WEBHOOK_SECRET }}
          PR_URL: ${{ steps.pull.outputs.url }}
          PR_TITLE: ${{ steps.pull.outputs.title }}
          AUTHOR_ASSOCIATION: ${{ steps.pull.outputs.association }}
          HEAD_REF: ${{ steps.pull.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pull.outputs.head_sha }}
          BASE_REF: ${{ steps.pull.outputs.base_ref }}
        run: bun scripts/coolify-preview.ts close

      - name: Retire the GitHub preview deployments
        if: steps.pull.outputs.stale == 'true' && steps.close.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const controller = await import(`${process.env.GITHUB_WORKSPACE}/scripts/preview-controller.ts`);
            await controller.retire({ github, context, core });
