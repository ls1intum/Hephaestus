name: Version PR

# Maintains the changesets Version PR; release.yml handles merged version bumps.
# GITHUB_TOKEN-authored updates do not trigger CI, so release automation uses the
# ruleset bypass. A release still requires successful main CI.
#
# Contributor guide: docs/contributor/release-management.mdx

on:
  push:
    branches: [main]

concurrency:
  group: version-pr
  cancel-in-progress: false

permissions: {}

jobs:
  version-pr:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          install: "frozen"

      - name: Maintain Version PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run changeset:version
          # release.yml owns release tags, publication, and deployment.
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
