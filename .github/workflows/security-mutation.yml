name: Security mutation testing

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/security-mutation.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/run-security-mutations.ts"
      - "server/application/pom.xml"
      - "server/application/src/main/java/de/tum/cit/aet/hephaestus/core/auth/oauth/AdminBootstrapPolicy.java"
      - "server/application/src/main/java/de/tum/cit/aet/hephaestus/core/auth/oauth/AuthIntentCookie.java"
      - "server/application/src/main/java/de/tum/cit/aet/hephaestus/core/auth/oauth/CookieOAuth2AuthorizationRequestRepository.java"
      - "server/application/src/main/java/de/tum/cit/aet/hephaestus/core/auth/oauth/ReturnToValidator.java"
      - "server/application/src/main/java/de/tum/cit/aet/hephaestus/core/security/ImpersonationGuard.java"
      - "server/application/src/main/java/de/tum/cit/aet/hephaestus/core/security/OutlineOriginPolicy.java"
      - "server/application/src/main/java/de/tum/cit/aet/hephaestus/core/security/PrivateAddressGuard.java"
      - "server/application/src/main/java/de/tum/cit/aet/hephaestus/core/security/ServerUrlValidator.java"
      - "server/application/src/main/java/de/tum/cit/aet/hephaestus/integration/core/connection/EncryptionContext.java"
      - "server/application/src/main/java/de/tum/cit/aet/hephaestus/integration/core/oauth/state/HmacOAuthStateService.java"
      - "server/application/src/main/java/de/tum/cit/aet/hephaestus/integration/scm/gitlab/webhook/GitlabWebhookSignatureVerifier.java"
      - "server/application/src/test/java/de/tum/cit/aet/hephaestus/core/auth/oauth/AdminBootstrapPolicyTest.java"
      - "server/application/src/test/java/de/tum/cit/aet/hephaestus/core/auth/oauth/AuthIntentCookieTest.java"
      - "server/application/src/test/java/de/tum/cit/aet/hephaestus/core/auth/oauth/CookieOAuth2AuthorizationRequestRepositoryTest.java"
      - "server/application/src/test/java/de/tum/cit/aet/hephaestus/core/auth/oauth/ReturnToValidatorTest.java"
      - "server/application/src/test/java/de/tum/cit/aet/hephaestus/core/security/ImpersonationGuardTest.java"
      - "server/application/src/test/java/de/tum/cit/aet/hephaestus/core/security/OutlineOriginPolicyTest.java"
      - "server/application/src/test/java/de/tum/cit/aet/hephaestus/core/security/PrivateAddressGuardTest.java"
      - "server/application/src/test/java/de/tum/cit/aet/hephaestus/core/security/ServerUrlValidatorTest.java"
      - "server/application/src/test/java/de/tum/cit/aet/hephaestus/integration/core/connection/EncryptionContextTest.java"
      - "server/application/src/test/java/de/tum/cit/aet/hephaestus/integration/core/oauth/state/HmacOAuthStateServiceTest.java"
      - "server/application/src/test/java/de/tum/cit/aet/hephaestus/integration/scm/gitlab/webhook/GitlabWebhookSignatureVerifierTest.java"
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: read

concurrency:
  group: security-mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pitest:
    name: Security mutation suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "server/**/pom.xml"

      - uses: ./.github/actions/setup-pnpm-node

      - name: Install repository tooling
        run: pnpm install --frozen-lockfile

      - name: Run security mutation suite
        run: timeout --kill-after=30s 8m pnpm run test:server:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-mutation-report-${{ github.run_id }}
          path: server/application/target/pit-reports
          if-no-files-found: error
          retention-days: 30
