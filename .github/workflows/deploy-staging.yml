name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      image-tag:
        type: string
        required: true
        description: Immutable release tag (for example, v1.2.3)
  workflow_call:
    inputs:
      image-tag:
        type: string
        required: true
        description: Immutable release tag (for example, v1.2.3)

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-locked-compose.yml
    with:
      environment: Staging
      release: ${{ inputs.image-tag }}
    secrets: inherit
