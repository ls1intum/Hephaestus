name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      image-tag:
        type: string
        required: true
        description: Immutable release tag (for example, v1.2.3)
  workflow_call:
    inputs:
      image-tag:
        type: string
        required: true
        description: Immutable release tag (for example, v1.2.3)

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-locked-compose.yml
    with:
      environment: Staging
      release: ${{ inputs.image-tag }}
    # Deploy credentials include organization secrets, which reach the locked-compose
    # workflow only through inheritance — environment secrets alone do not cover them.
    secrets: inherit # zizmor: ignore[secrets-inherit]
