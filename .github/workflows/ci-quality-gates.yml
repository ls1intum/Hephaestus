name: Quality

on:
  workflow_call:
    inputs:
      should_skip:
        description: "Whether to skip the workflow"
        required: false
        type: string
        default: "false"
      webapp_changed:
        description: "Whether webapp files changed (or should run for other reasons)"
        required: false
        type: string
        default: "true"
      application_server_changed:
        description: "Whether application-server files changed (or should run for other reasons)"
        required: false
        type: string
        default: "true"
      tooling_changed:
        description: "Whether repository tooling, docs, or instruction files changed"
        required: false
        type: string
        default: "true"
      postgres_image_changed:
        description: "Whether the PostgreSQL image inputs changed"
        required: false
        type: string
        default: "false"
      contracts_changed:
        description: "Whether server contracts or their PostgreSQL image changed"
        required: false
        type: string
        default: "true"
      pmd_canary:
        description: "Whether PMD wiring inputs changed"
        required: false
        type: string
        default: "false"

jobs:
  quality-gates:
    name: "${{ matrix.display-name }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    if: inputs.should_skip != 'true'
    timeout-minutes: ${{ matrix.check == 'server-contracts' && 25 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: application-server-quality
            display-name: "App Server"
          - check: tooling-quality
            display-name: "Tooling and Docs"
          - check: webapp-quality
            display-name: "Webapp"
          - check: server-contracts
            display-name: "API and Database"
    steps:
      - name: Determine if check should run
        id: should_run
        run: |
          case "${{ matrix.check }}" in
            "webapp-quality")
              echo "run=${INPUTS_WEBAPP_CHANGED}" >> $GITHUB_OUTPUT
              ;;
            "application-server-quality")
              echo "run=${INPUTS_APPLICATION_SERVER_CHANGED}" >> $GITHUB_OUTPUT
              ;;
            "server-contracts")
              echo "run=${INPUTS_CONTRACTS_CHANGED}" >> $GITHUB_OUTPUT
              ;;
            "tooling-quality")
              echo "run=${INPUTS_TOOLING_CHANGED}" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "::error::Unknown check type '${{ matrix.check }}' in ci-quality-gates.yml matrix."
              echo "::error::Please add a case for this check in the 'Determine if check should run' step."
              echo "run=false" >> $GITHUB_OUTPUT
              exit 1
              ;;
          esac
        env:
          INPUTS_WEBAPP_CHANGED: ${{ inputs.webapp_changed }}
          INPUTS_APPLICATION_SERVER_CHANGED: ${{ inputs.application_server_changed }}
          INPUTS_CONTRACTS_CHANGED: ${{ inputs.contracts_changed }}
          INPUTS_TOOLING_CHANGED: ${{ inputs.tooling_changed }}

      - name: Skip notification
        if: steps.should_run.outputs.run != 'true'
        run: echo "⏭️ Skipping ${{ matrix.check }} - no relevant files changed"

      - name: Checkout repository
        if: steps.should_run.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The depths are QUOTED. Unquoted, `cond && 0 || 1` always yields 1, because the number 0
          # is falsy in GitHub expressions; the non-empty string '0' is truthy.
          fetch-depth: ${{ matrix.check == 'application-server-quality' && '0' || '1' }}
          persist-credentials: false

      - name: Setup Node.js and pnpm
        if: steps.should_run.outputs.run == 'true'
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup application-server caches
        if: steps.should_run.outputs.run == 'true' && matrix.check == 'application-server-quality'
        uses: ./.github/actions/setup-caches
        with:
          cache-type: application-server-quality
          os: ${{ runner.os }}

      - name: Setup server-contract caches
        if: steps.should_run.outputs.run == 'true' && matrix.check == 'server-contracts'
        uses: ./.github/actions/setup-caches
        with:
          cache-type: server-contracts
          os: ${{ runner.os }}

      - name: Application-server quality
        if: steps.should_run.outputs.run == 'true' && matrix.check == 'application-server-quality'
        run: |
          pnpm install --frozen-lockfile
          ISSUES_FOUND=()
          SERVER_OK=true; PMD_CANARY_OK=true; NULLNESS_OK=true; CONTRACTS_OK=true; ENV_OK=true

          pnpm run check:server || { SERVER_OK=false; ISSUES_FOUND+=("Server formatting or PMD failed. Run: pnpm run check:server"); }
          pnpm run check:java-nullness \
            || { NULLNESS_OK=false; ISSUES_FOUND+=("Java nullness policy failed. Run: pnpm run check:java-nullness"); }
          if [ "$SERVER_OK" = "true" ] && [ "${INPUTS_PMD_CANARY}" = "true" ]; then
            PMD_CANARY=server/application/src/main/java/de/tum/cit/aet/hephaestus/Application.java
            cp "$PMD_CANARY" "$RUNNER_TEMP/Application.java"
            trap 'cp "$RUNNER_TEMP/Application.java" "$PMD_CANARY"' EXIT
            sed -i '/public class Application {/a\    private int deliberatelyUnusedPmdCanary;' "$PMD_CANARY"
            if pnpm run lint:java; then
              PMD_CANARY_OK=false
              ISSUES_FOUND+=("PMD accepted a planted UnusedPrivateField violation; the gate is not analyzing current main sources")
            fi
            cp "$RUNNER_TEMP/Application.java" "$PMD_CANARY"
            trap - EXIT
          fi
          pnpm run check:contracts || { CONTRACTS_OK=false; ISSUES_FOUND+=("Artifact-source contract validation failed. Run: pnpm run check:contracts"); }
          pnpm run check:env || { ENV_OK=false; ISSUES_FOUND+=("A setting does not reach a container that can read it. Run: pnpm run check:env"); }

          if [ ${#ISSUES_FOUND[@]} -gt 0 ]; then
            echo "### App Server Quality" >> $GITHUB_STEP_SUMMARY
            echo "| Check | Status | Fix |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|-----|" >> $GITHUB_STEP_SUMMARY
            [[ "$SERVER_OK" == "false" ]] && echo "| Server formatting and PMD | :x: Failed | \`pnpm run check:server\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$PMD_CANARY_OK" == "false" ]] && echo "| PMD canary | :x: Failed | Inspect the planted-violation check |" >> $GITHUB_STEP_SUMMARY
            [[ "$NULLNESS_OK" == "false" ]] && echo "| Java nullness policy | :x: Failed | \`pnpm run check:java-nullness\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$CONTRACTS_OK" == "false" ]] && echo "| Artifact-source contracts | :x: Failed | \`pnpm run check:contracts\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$ENV_OK" == "false" ]] && echo "| Env delivery by runtime role | :x: Failed | \`pnpm run check:env\` |" >> $GITHUB_STEP_SUMMARY
            for issue in "${ISSUES_FOUND[@]}"; do echo "::error::$issue"; done
            exit 1
          fi
        env:
          INPUTS_PMD_CANARY: ${{ inputs.pmd_canary }}

      - name: Tooling and docs quality
        if: steps.should_run.outputs.run == 'true' && matrix.check == 'tooling-quality'
        run: |
          pnpm install --frozen-lockfile
          pnpm run check:package-manager
          pnpm run check:agent-runtime-pins
          pnpm run check:agents
          pnpm run format:load:check
          pnpm run test:load:syntax
          pnpm run test:agents
          pnpm run check:instructions
          pnpm run docs:lint
          pnpm run check:diagrams

      - name: Webapp quality
        if: steps.should_run.outputs.run == 'true' && matrix.check == 'webapp-quality'
        working-directory: ./webapp
        run: |
          cd ..
          pnpm install --frozen-lockfile
          cd webapp

          ISSUES_FOUND=()
          CLIENT_OK=true
          COMPONENTS_OK=true
          STORIES_OK=true
          SORT_OK=true
          TOKENS_OK=true
          BUILD_OK=true
          ROUTES_OK=true
          TESTS_OK=true

          (cd .. && pnpm run check:client) || {
            CLIENT_OK=false
            ISSUES_FOUND+=("Webapp lint, formatting, or typecheck failed. Run: pnpm run check:client")
          }
          (cd .. && pnpm run check:components) || { COMPONENTS_OK=false; ISSUES_FOUND+=("Components must take data as props. Run: pnpm run check:components"); }
          (cd .. && pnpm run check:stories) || { STORIES_OK=false; ISSUES_FOUND+=("Story prose renders HTML paragraphs. Run: pnpm run check:stories"); }
          (cd .. && pnpm run check:story-sort) || { SORT_OK=false; ISSUES_FOUND+=("Storybook sidebar order is stale. Run: pnpm run check:story-sort"); }
          (cd .. && pnpm run check:docs-tokens) || { TOKENS_OK=false; ISSUES_FOUND+=("The docs site copies a web app colour that has since changed. Run: pnpm run check:docs-tokens"); }
          timeout --kill-after=30s 10m pnpm run test \
            || { TESTS_OK=false; ISSUES_FOUND+=("Unit tests failed. Run: cd webapp && pnpm run test"); }

          # Vite generates src/routeTree.gen.ts; compare it with the committed copy after building.
          pnpm exec vite build || { BUILD_OK=false; ISSUES_FOUND+=("The webapp does not build. Run: cd webapp && pnpm run build"); }
          if [ "$BUILD_OK" = "true" ] && ! git diff --exit-code -- src/routeTree.gen.ts; then
            ROUTES_OK=false
            ISSUES_FOUND+=("routeTree.gen.ts is stale. Run: cd webapp && pnpm run build, then commit the result")
          fi

          if [ ${#ISSUES_FOUND[@]} -gt 0 ]; then
            echo "### Webapp Quality" >> $GITHUB_STEP_SUMMARY
            echo "| Check | Status | Fix |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|-----|" >> $GITHUB_STEP_SUMMARY
            [[ "$CLIENT_OK" == "false" ]] && echo "| Lint, format, and TypeScript | :x: Failed | \`pnpm run check:client\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$COMPONENTS_OK" == "false" ]] && echo "| Presentational components | :x: Failed | \`pnpm run check:components\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$STORIES_OK" == "false" ]] && echo "| Story prose | :x: Failed | \`pnpm run check:stories\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$SORT_OK" == "false" ]] && echo "| Storybook sidebar order | :x: Failed | \`pnpm run check:story-sort\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$TOKENS_OK" == "false" ]] && echo "| Docs colour tokens | :x: Failed | \`pnpm run check:docs-tokens\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$BUILD_OK" == "false" ]] && echo "| Vite build | :x: Failed | \`cd webapp && pnpm run build\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$ROUTES_OK" == "false" ]] && echo "| routeTree.gen.ts up to date | :x: Stale | \`cd webapp && pnpm run build\` and commit |" >> $GITHUB_STEP_SUMMARY
            [[ "$TESTS_OK" == "false" ]] && echo "| Unit tests | :x: Failed | \`cd webapp && pnpm run test\` |" >> $GITHUB_STEP_SUMMARY
            for issue in "${ISSUES_FOUND[@]}"; do echo "::error::$issue"; done
            exit 1
          fi

      - name: Upload webapp unit-test results
        if: steps.should_run.outputs.run == 'true' && matrix.check == 'webapp-quality' && always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: "Test Results - Webapp Unit"
          path: "webapp/test-results/junit-*.xml"
          reporter: java-junit
          fail-on-error: false

      - name: Summarize webapp unit tests
        if: steps.should_run.outputs.run == 'true' && matrix.check == 'webapp-quality' && always()
        continue-on-error: true
        run: pnpm run summarize:test-results "Webapp Unit" webapp/test-results ci-metrics/webapp-unit.json

      - name: Upload webapp test metrics
        if: steps.should_run.outputs.run == 'true' && matrix.check == 'webapp-quality' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-metrics-webapp-unit
          path: ci-metrics/webapp-unit.json
          if-no-files-found: ignore
          retention-days: 14

      - name: OpenAPI validation
        id: openapi
        continue-on-error: true
        if: steps.should_run.outputs.run == 'true' && matrix.check == 'server-contracts'
        env:
          DATABASE_URL: postgresql://fake:fake@localhost:5432/fake
          MODEL_NAME: fake:model
        run: |
          pnpm install --frozen-lockfile
          pnpm run generate:api
          git add .
          if ! git diff --cached --quiet; then
            echo "::error::OpenAPI out of sync. Run: pnpm run generate:api"
            echo "### OpenAPI Validation" >> $GITHUB_STEP_SUMMARY
            echo "| Check | Status | Fix |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|-----|" >> $GITHUB_STEP_SUMMARY
            echo "| API specs sync | :x: Out of sync | \`pnpm run generate:api\` |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Database validation (schema + ERD + models)
        id: database
        continue-on-error: true
        if: steps.should_run.outputs.run == 'true' && matrix.check == 'server-contracts' && always()
        run: |
          # The base image may still be publishing; build the same Dockerfile as fallback.
          if [[ "${INPUTS_POSTGRES_IMAGE_CHANGED}" == "true" ]] ||
            ! docker pull ghcr.io/ls1intum/hephaestus/postgres:${{ github.event.pull_request.base.sha || github.sha }}; then
            docker build -t hephaestus-postgres:ci docker/postgres
          else
            docker tag ghcr.io/ls1intum/hephaestus/postgres:${{ github.event.pull_request.base.sha || github.sha }} hephaestus-postgres:ci
          fi
          docker run -d --name postgres-db \
            -e POSTGRES_DB=hephaestus -e POSTGRES_PASSWORD=root -e POSTGRES_USER=root \
            -p 5432:5432 hephaestus-postgres:ci
          trap 'docker stop postgres-db 2>/dev/null; docker rm postgres-db 2>/dev/null' EXIT
          until docker exec postgres-db pg_isready -U root -d hephaestus; do sleep 2; done

          export SPRING_DATASOURCE_URL="jdbc:postgresql://localhost:5432/hephaestus"
          export SPRING_DATASOURCE_USERNAME="root"
          export SPRING_DATASOURCE_PASSWORD="root"

          if ! (cd server && ./mvnw test -pl application -am -Dsurefire.includedGroups=database -DskipCoverage=true --quiet); then
            echo "::error::Maven compilation or database contract tests failed. Fix the reported error before continuing."
            echo "### Database Validation" >> $GITHUB_STEP_SUMMARY
            echo "| Check | Status | Fix |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|-----|" >> $GITHUB_STEP_SUMMARY
            echo "| Maven compile | :x: Failed | Fix compilation errors in \`server\` |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          ISSUES_FOUND=()

          # draft-changelog first applies the full master.xml chain to the empty DB via
          # liquibase:update — so this step is ALSO the empty→head migration-chain replay gate (a
          # changelog that doesn't apply fails here). Keep that apply intact.
          pnpm run db:draft-changelog || ISSUES_FOUND+=("Schema check / migration-chain apply failed. Run: pnpm run db:draft-changelog")
          if [ -f "server/application/src/main/resources/db/changelog_new.xml" ]; then
            echo "::error::Schema drift detected. Run: pnpm run db:draft-changelog"
            cat server/application/src/main/resources/db/changelog_new.xml
            ISSUES_FOUND+=("Schema drift detected")
          fi

          pnpm run db:generate-erd-docs || ISSUES_FOUND+=("ERD generation failed. Run: pnpm run db:generate-erd-docs")
          git add docs/contributor/erd/schema.mmd
          if ! git diff --cached --quiet docs/contributor/erd/schema.mmd; then
            echo "::error::ERD outdated. Run: pnpm run db:generate-erd-docs"
            ISSUES_FOUND+=("ERD outdated")
          fi

          if [ ${#ISSUES_FOUND[@]} -gt 0 ]; then
            echo "### Database Validation" >> $GITHUB_STEP_SUMMARY
            echo "| Check | Status | Fix |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|-----|" >> $GITHUB_STEP_SUMMARY
            for issue in "${ISSUES_FOUND[@]}"; do
              echo "::error::$issue"
              if [[ "$issue" == *"Run:"* ]]; then
                echo "| ${issue%%.*} | :x: Failed | \`${issue##*Run: }\` |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| $issue | :x: Failed | See logs |" >> $GITHUB_STEP_SUMMARY
              fi
            done
            exit 1
          fi
        env:
          INPUTS_POSTGRES_IMAGE_CHANGED: ${{ inputs.postgres_image_changed }}

      - name: Evaluate API and database contracts
        if: steps.should_run.outputs.run == 'true' && matrix.check == 'server-contracts' && always()
        env:
          OPENAPI: ${{ steps.openapi.outcome }}
          DATABASE: ${{ steps.database.outcome }}
        run: |
          if [ "$OPENAPI" != "success" ] || [ "$DATABASE" != "success" ]; then
            echo "::error::OpenAPI or database validation failed; review both independently reported steps."
            exit 1
          fi
