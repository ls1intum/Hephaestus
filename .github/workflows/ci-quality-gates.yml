name: Quality

on:
  workflow_call:
    inputs:
      should_skip:
        description: "Whether to skip the workflow"
        required: false
        type: string
        default: "false"
      webapp_changed:
        description: "Whether webapp files changed (or should run for other reasons)"
        required: false
        type: string
        default: "true"
      application_server_changed:
        description: "Whether application-server files changed (or should run for other reasons)"
        required: false
        type: string
        default: "true"

jobs:
  quality-gates:
    name: "${{ matrix.display-name }}"
    runs-on: ubuntu-latest
    if: inputs.should_skip != 'true'
    timeout-minutes: ${{ matrix.check == 'database-validation' && 20 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: application-server-quality
            display-name: "App Server"
          - check: webapp-quality
            display-name: "Webapp"
          - check: openapi-validation
            display-name: "OpenAPI"
          - check: database-validation
            display-name: "Database"
          - check: database-migrations
            display-name: "Migrations"
    steps:
      - name: Determine if check should run
        id: should_run
        run: |
          case "${{ matrix.check }}" in
            "webapp-quality")
              echo "run=${{ inputs.webapp_changed }}" >> $GITHUB_OUTPUT
              ;;
            "application-server-quality"|"openapi-validation"|"database-validation"|"database-migrations")
              echo "run=${{ inputs.application_server_changed }}" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "::error::Unknown check type '${{ matrix.check }}' in ci-quality-gates.yml matrix."
              echo "::error::Please add a case for this check in the 'Determine if check should run' step."
              echo "run=false" >> $GITHUB_OUTPUT
              exit 1
              ;;
          esac

      - name: Skip notification
        if: steps.should_run.outputs.run != 'true'
        run: echo "⏭️ Skipping ${{ matrix.check }} - no relevant files changed"

      - name: Checkout repository
        if: steps.should_run.outputs.run == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history for the three legs that compare against a base commit: check:contracts
          # resolves `git merge-base HEAD origin/<base>`, and both database legs diff the changelog
          # tree. The rest only need HEAD.
          # The depths are QUOTED. Unquoted, `cond && 0 || 1` always yields 1, because the number 0
          # is falsy in GitHub expressions; the non-empty string '0' is truthy.
          fetch-depth: ${{ contains(fromJSON('["application-server-quality", "database-validation", "database-migrations"]'), matrix.check) && '0' || '1' }}

      - name: Setup pnpm + Node.js
        # database-migrations is a pure git check — no Node/pnpm/JDK/Maven needed.
        if: steps.should_run.outputs.run == 'true' && matrix.check != 'database-migrations'
        uses: ./.github/actions/setup-pnpm-node

      # The agent runtime is Bun, so its tests and typecheck must run on the Bun the sandbox ships.
      # The image pins the version alongside the per-arch digests that are only valid for it.
      - name: Resolve the agent image's Bun version
        id: bun
        if: steps.should_run.outputs.run == 'true' && matrix.check == 'application-server-quality'
        run: |
          # Fail closed: an empty output would make setup-bun fall back to `latest`, which is the
          # unpinned install this job exists to avoid.
          version=$(sed -nE 's/^ARG[[:space:]]+BUN_VERSION=["'"'"']?([^"'"'"'[:space:]]+).*/\1/p' docker/agents/pi/Dockerfile | head -1)
          if [ -z "$version" ]; then
            echo "::error::No ARG BUN_VERSION in docker/agents/pi/Dockerfile — refusing to install an unpinned Bun."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        if: steps.should_run.outputs.run == 'true' && matrix.check == 'application-server-quality'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Setup caches
        if: steps.should_run.outputs.run == 'true' && matrix.check != 'database-migrations'
        uses: ./.github/actions/setup-caches
        with:
          cache-type: ${{ matrix.check }}
          os: ${{ runner.os }}

      - name: Application-server formatting + agent runtime + contracts
        if: steps.should_run.outputs.run == 'true' && matrix.check == 'application-server-quality'
        run: |
          pnpm install --frozen-lockfile

          # Every gate below is also in `pnpm run check`, which the pre-push hook runs and
          # `--no-verify` skips. This step is the only place they are mandatory.
          ISSUES_FOUND=()
          FMT_OK=true; PMD_OK=true; LINT_OK=true; PIN_OK=true; TESTS_OK=true; TYPES_OK=true; SCRIPT_TYPES_OK=true; CONTRACTS_OK=true; ENV_OK=true; DOCS_OK=true; DIAGRAMS_OK=true; INSTRUCTIONS_OK=true

          pnpm run format:java:check || { FMT_OK=false; ISSUES_FOUND+=("Java formatting failed. Run: pnpm run format:java"); }
          pnpm run lint:java || { PMD_OK=false; ISSUES_FOUND+=("PMD found violations. Run: pnpm run lint:java:report"); }
          # Verify the public lint command rejects a representative violation.
          if [ "$PMD_OK" = "true" ]; then
            PMD_CANARY=server/src/main/java/de/tum/cit/aet/hephaestus/Application.java
            cp "$PMD_CANARY" "$RUNNER_TEMP/Application.java"
            trap 'cp "$RUNNER_TEMP/Application.java" "$PMD_CANARY"' EXIT
            sed -i '/public class Application {/a\    private int deliberatelyUnusedPmdCanary;' "$PMD_CANARY"
            if pnpm run lint:java; then
              PMD_OK=false
              ISSUES_FOUND+=("PMD accepted a planted UnusedPrivateField violation; the gate is not analyzing current main sources")
            fi
            cp "$RUNNER_TEMP/Application.java" "$PMD_CANARY"
            trap - EXIT
          fi
          # Runs before the Biome step so a version skew is reported as a version skew rather than
          # as a wall of formatting diffs from the wrong release.
          pnpm run check:biome-pin \
            || { PIN_OK=false; ISSUES_FOUND+=("Biome version skew between package.json, node_modules and the \$schema URLs."); }
          # `ci:agents` rather than `check:agents`: its Biome and oxlint reporters emit GitHub
          # annotations, so findings land on the diff instead of only in this log. It runs no
          # typecheck — those are the two separate legs below.
          pnpm run ci:agents \
            || { LINT_OK=false; ISSUES_FOUND+=("Lint or formatting failed outside the webapp. Run: pnpm run check:agents:fix"); }
          pnpm run test:agents \
            || { TESTS_OK=false; ISSUES_FOUND+=("Agent runtime test(s) failed. Run: pnpm run test:agents"); }
          pnpm run typecheck:agents \
            || { TYPES_OK=false; ISSUES_FOUND+=("Agent TypeScript errors. Run: pnpm run typecheck:agents"); }
          pnpm run typecheck:scripts \
            || { SCRIPT_TYPES_OK=false; ISSUES_FOUND+=("scripts/ TypeScript errors. Run: pnpm run typecheck:scripts"); }
          pnpm run check:contracts || { CONTRACTS_OK=false; ISSUES_FOUND+=("Artifact-source contract validation failed. Run: pnpm run check:contracts"); }
          # Reads server/application.yml against docker/compose.{app,core}.yaml — the deployment that
          # has to deliver each setting. Both sides are behind this job's path filter.
          pnpm run check:env || { ENV_OK=false; ISSUES_FOUND+=("A setting does not reach a container that can read it. Run: pnpm run check:env"); }
          # An AGENTS.md no CLAUDE.md imports is loaded by every agent except Claude Code, and nothing
          # about the file says so — this is the only place that reads the wiring end to end.
          pnpm run check:instructions \
            || { INSTRUCTIONS_OK=false; ISSUES_FOUND+=("An agent instruction file reaches no agent, or exists in two copies. Run: pnpm run check:instructions"); }
          # docs/decisions/ and docs/runbooks/ are mounted by no Docusaurus plugin, so the site build
          # never compiles or link-checks them. Markdown lint is the only gate they have.
          pnpm run docs:lint || { DOCS_OK=false; ISSUES_FOUND+=("docs/ markdown or typecheck failed. Run: pnpm run docs:lint"); }
          # Docusaurus renders mermaid in the browser, so a diagram it cannot parse builds green and
          # publishes as an error box — the docs deployment can never be the gate for it. This leg
          # owns the check because docs/** is behind this job's path filter and no other job's.
          pnpm run check:diagrams \
            || { DIAGRAMS_OK=false; ISSUES_FOUND+=("A committed Mermaid diagram does not parse. Run: pnpm run check:diagrams"); }

          if [ ${#ISSUES_FOUND[@]} -gt 0 ]; then
            echo "### App Server Quality" >> $GITHUB_STEP_SUMMARY
            echo "| Check | Status | Fix |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|-----|" >> $GITHUB_STEP_SUMMARY
            [[ "$FMT_OK" == "false" ]] && echo "| Java formatting | :x: Failed | \`pnpm run format:java\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$PMD_OK" == "false" ]] && echo "| Java lint (PMD) | :x: Failed | \`pnpm run lint:java:report\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$PIN_OK" == "false" ]] && echo "| Biome version pin | :x: Failed | \`pnpm run check:biome-pin\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$LINT_OK" == "false" ]] && echo "| Lint + format (outside webapp) | :x: Failed | \`pnpm run check:agents:fix\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$TESTS_OK" == "false" ]] && echo "| Agent runtime tests | :x: Failed | \`pnpm run test:agents\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$TYPES_OK" == "false" ]] && echo "| Agent typecheck | :x: Failed | \`pnpm run typecheck:agents\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$SCRIPT_TYPES_OK" == "false" ]] && echo "| scripts/ typecheck | :x: Failed | \`pnpm run typecheck:scripts\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$CONTRACTS_OK" == "false" ]] && echo "| Artifact-source contracts | :x: Failed | \`pnpm run check:contracts\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$ENV_OK" == "false" ]] && echo "| Env delivery by runtime role | :x: Failed | \`pnpm run check:env\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$INSTRUCTIONS_OK" == "false" ]] && echo "| Agent instruction wiring | :x: Failed | \`pnpm run check:instructions\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$DOCS_OK" == "false" ]] && echo "| Docs lint + typecheck | :x: Failed | \`pnpm run docs:lint\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$DIAGRAMS_OK" == "false" ]] && echo "| Mermaid diagrams | :x: Failed | \`pnpm run check:diagrams\` |" >> $GITHUB_STEP_SUMMARY
            for issue in "${ISSUES_FOUND[@]}"; do echo "::error::$issue"; done
            exit 1
          fi

      - name: Webapp quality
        if: steps.should_run.outputs.run == 'true' && matrix.check == 'webapp-quality'
        working-directory: ./webapp
        run: |
          cd ..
          pnpm install --frozen-lockfile
          cd webapp

          # These gates also run in `pnpm run check`, which the pre-push hook runs and `--no-verify`
          # skips — except the Vite build and the routeTree comparison, which run only here.
          ISSUES_FOUND=()
          LINT_OK=true
          TYPES_OK=true
          COMPONENTS_OK=true
          STORIES_OK=true
          SORT_OK=true
          BUILD_OK=true
          ROUTES_OK=true

          pnpm run check || { LINT_OK=false; ISSUES_FOUND+=("Lint or formatting failed. Run: cd webapp && pnpm run check:fix"); }
          pnpm run typecheck || { TYPES_OK=false; ISSUES_FOUND+=("TypeScript errors found. Run: cd webapp && pnpm run typecheck"); }
          node ../scripts/check-presentational-components.ts || { COMPONENTS_OK=false; ISSUES_FOUND+=("Components must take data as props. Run: pnpm run check:components"); }
          node ../scripts/check-story-prose.ts || { STORIES_OK=false; ISSUES_FOUND+=("Story prose renders HTML paragraphs. Run: pnpm run check:stories"); }
          node ../scripts/check-story-sort.ts || { SORT_OK=false; ISSUES_FOUND+=("Storybook sidebar order is stale. Run: pnpm run check:story-sort"); }

          # src/routeTree.gen.ts is written by the TanStack Router Vite plugin, so a build is the
          # only thing that can say whether the committed copy is current. The webapp image build
          # regenerates it too but has nothing to compare it against, and it is skipped whenever
          # webapp/ itself did not change. A stale tree type-checks and tests green; the route it is
          # missing simply 404s.
          pnpm exec vite build || { BUILD_OK=false; ISSUES_FOUND+=("The webapp does not build. Run: cd webapp && pnpm run build"); }
          if [ "$BUILD_OK" = "true" ] && ! git diff --exit-code -- src/routeTree.gen.ts; then
            ROUTES_OK=false
            ISSUES_FOUND+=("routeTree.gen.ts is stale. Run: cd webapp && pnpm run build, then commit the result")
          fi

          if [ ${#ISSUES_FOUND[@]} -gt 0 ]; then
            echo "### Webapp Quality" >> $GITHUB_STEP_SUMMARY
            echo "| Check | Status | Fix |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|-----|" >> $GITHUB_STEP_SUMMARY
            [[ "$LINT_OK" == "false" ]] && echo "| Lint + format (oxlint + Biome) | :x: Failed | \`cd webapp && pnpm run check:fix\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$TYPES_OK" == "false" ]] && echo "| TypeScript | :x: Failed | \`cd webapp && pnpm run typecheck\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$COMPONENTS_OK" == "false" ]] && echo "| Presentational components | :x: Failed | \`pnpm run check:components\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$STORIES_OK" == "false" ]] && echo "| Story prose | :x: Failed | \`pnpm run check:stories\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$SORT_OK" == "false" ]] && echo "| Storybook sidebar order | :x: Failed | \`pnpm run check:story-sort\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$BUILD_OK" == "false" ]] && echo "| Vite build | :x: Failed | \`cd webapp && pnpm run build\` |" >> $GITHUB_STEP_SUMMARY
            [[ "$ROUTES_OK" == "false" ]] && echo "| routeTree.gen.ts up to date | :x: Stale | \`cd webapp && pnpm run build\` and commit |" >> $GITHUB_STEP_SUMMARY
            for issue in "${ISSUES_FOUND[@]}"; do echo "::error::$issue"; done
            exit 1
          fi

      - name: OpenAPI validation
        if: steps.should_run.outputs.run == 'true' && matrix.check == 'openapi-validation'
        env:
          DATABASE_URL: postgresql://fake:fake@localhost:5432/fake
          MODEL_NAME: fake:model
        run: |
          pnpm install --frozen-lockfile
          cd server
          mvn compile -DskipTests --quiet -Dmaven.build.cache.enabled=true
          cd ..

          pnpm run generate:api
          git add .
          if ! git diff --cached --quiet; then
            echo "::error::OpenAPI out of sync. Run: pnpm run generate:api"
            echo "### OpenAPI Validation" >> $GITHUB_STEP_SUMMARY
            echo "| Check | Status | Fix |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|-----|" >> $GITHUB_STEP_SUMMARY
            echo "| API specs sync | :x: Out of sync | \`pnpm run generate:api\` |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Database validation (schema + ERD + models)
        if: steps.should_run.outputs.run == 'true' && matrix.check == 'database-validation'
        run: |
          pnpm install --frozen-lockfile

          # The pg_partman image, not stock Postgres: the auth_event changeset that calls
          # partman.create_parent is preconditioned onFail="MARK_RAN" on the extension being
          # available, so on a stock image the chain replays with that changeset never executed.
          docker build -t hephaestus-postgres:ci docker/postgres
          docker run -d --name postgres-db \
            -e POSTGRES_DB=hephaestus -e POSTGRES_PASSWORD=root -e POSTGRES_USER=root \
            -p 5432:5432 hephaestus-postgres:ci
          trap 'docker stop postgres-db 2>/dev/null; docker rm postgres-db 2>/dev/null' EXIT
          until docker exec postgres-db pg_isready -U root -d hephaestus; do sleep 2; done

          export SPRING_DATASOURCE_URL="jdbc:postgresql://localhost:5432/hephaestus"
          export SPRING_DATASOURCE_USERNAME="root"
          export SPRING_DATASOURCE_PASSWORD="root"

          if ! (cd server && mvn compile -DskipTests --quiet -Dmaven.build.cache.enabled=true); then
            echo "::error::Maven compilation failed. This blocks all database validation checks. Fix compilation errors first."
            echo "### Database Validation" >> $GITHUB_STEP_SUMMARY
            echo "| Check | Status | Fix |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|-----|" >> $GITHUB_STEP_SUMMARY
            echo "| Maven compile | :x: Failed | Fix compilation errors in \`server\` |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          ISSUES_FOUND=()

          # draft-changelog first applies the full master.xml chain to the empty DB via
          # liquibase:update — so this step is ALSO the empty→head migration-chain replay gate (a
          # changelog that doesn't apply fails here). Keep that apply intact.
          scripts/db-utils.sh draft-changelog || ISSUES_FOUND+=("Schema check / migration-chain apply failed. Run: pnpm run db:draft-changelog")
          if [ -f "server/src/main/resources/db/changelog_new.xml" ]; then
            echo "::error::Schema drift detected. Run: pnpm run db:draft-changelog"
            cat server/src/main/resources/db/changelog_new.xml
            ISSUES_FOUND+=("Schema drift detected")
          fi

          scripts/db-utils.sh generate-erd || ISSUES_FOUND+=("ERD generation failed. Run: pnpm run db:generate-erd-docs")
          git add docs/contributor/erd/schema.mmd
          if ! git diff --cached --quiet docs/contributor/erd/schema.mmd; then
            echo "::error::ERD outdated. Run: pnpm run db:generate-erd-docs"
            ISSUES_FOUND+=("ERD outdated")
          fi

          if [ ${#ISSUES_FOUND[@]} -gt 0 ]; then
            echo "### Database Validation" >> $GITHUB_STEP_SUMMARY
            echo "| Check | Status | Fix |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|-----|" >> $GITHUB_STEP_SUMMARY
            for issue in "${ISSUES_FOUND[@]}"; do
              echo "::error::$issue"
              if [[ "$issue" == *"Run:"* ]]; then
                echo "| ${issue%%.*} | :x: Failed | \`${issue##*Run: }\` |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| $issue | :x: Failed | See logs |" >> $GITHUB_STEP_SUMMARY
              fi
            done
            exit 1
          fi

      # database-migrations: git-level guard that released changelog files never change. The
      # empty→head chain replay already lives in the database-validation leg; this leg adds the
      # one thing replay can't — immutability. Why git, not Liquibase checksums:
      # docs/contributor/database-migration.mdx.
      - name: Resolve released-chain baseline
        id: baseline
        if: steps.should_run.outputs.run == 'true' && matrix.check == 'database-migrations'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Baseline = the released state this branch descends from. For a PR that is the base
          # commit (an ancestor of the checked-out merge ref, so `git diff BASE HEAD` is exactly
          # the PR's net change); for a main push it is the previous tip. checkout does NOT expose
          # origin/<base> as a ref, so use the SHA the event gives us directly.
          BASE=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # A PR always has a base commit, and it is always an ancestor of the merge ref. If it
            # is missing, the checkout is too shallow — fail loudly rather than let the guard
            # silently no-op, which would report a vacuous green.
            if ! git cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null; then
              echo "::error::PR base commit $PR_BASE_SHA is not in local history — this job needs fetch-depth: 0. Refusing to pass without checking."
              exit 1
            fi
            BASE="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            # Branch creation and force pushes leave no reachable previous tip; nothing released
            # to enforce against, so the guard is skipped.
            BASE="$PUSH_BEFORE"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Baseline: ${BASE:-<none — no reachable previous tip, nothing to enforce>}"

      - name: Changelog immutability guard
        if: steps.should_run.outputs.run == 'true' && matrix.check == 'database-migrations' && steps.baseline.outputs.base != ''
        env:
          BASE: ${{ steps.baseline.outputs.base }}
          RELEASED_REF: ${{ github.event_name == 'pull_request' && github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          CHANGELOG_DIR="server/src/main/resources/db/changelog"
          MASTER="server/src/main/resources/db/master.xml"
          FAILED=false

          # 1. No released changelog file may be modified, deleted, or renamed.
          VIOLATIONS=$(git diff --name-only --diff-filter=MDR "$BASE" HEAD -- "$CHANGELOG_DIR")
          if [ -n "$VIOLATIONS" ]; then
            FAILED=true
            echo "::error::Released Liquibase changesets were modified, renamed, or deleted. Ship a new follow-up changelog instead:"
            echo "$VIOLATIONS"
          fi

          # 2. master.xml is append-only: every <include> line the baseline had must survive
          #    unchanged, in order, as a prefix of the current list. Comparing whole lines (not
          #    just paths) also catches edits to a released include's attributes. Order is NOT
          #    asserted beyond the prefix — the historical list is not monotonic by timestamp.
          #    `|| true` keeps the `-s` guard live: an include-less baseline (never happens today)
          #    skips the check instead of aborting under pipefail.
          git show "$BASE:$MASTER" 2>/dev/null | grep '<include ' > /tmp/includes-base || true
          grep '<include ' "$MASTER" > /tmp/includes-head || true
          if [ -s /tmp/includes-base ] && ! diff /tmp/includes-base <(head -n "$(wc -l < /tmp/includes-base)" /tmp/includes-head) >/dev/null; then
            FAILED=true
            echo "::error::master.xml is append-only: an existing <include> was removed, reordered, or edited. New changelogs go at the end of the list."
          fi

          if [ "$FAILED" = "true" ]; then
            {
              echo "### Changelog immutability"
              echo "Changesets that reached \`$RELEASED_REF\` may already be applied to production databases — editing or removing them breaks the upgrade path (checksum errors or silently orphaned changesets)."
              echo "Fix forward with a **new** changelog appended to \`master.xml\`. See \`docs/contributor/database-migration.mdx\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "No released changeset was touched; master.xml stays append-only."

  legacy-cleanup-guard:
    name: "No legacy agent image"
    if: inputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
      - name: Assert no legacy agent-image references
        run: |
          set -euo pipefail
          # Needle built at runtime so this guard file doesn't self-match.
          NEEDLE="agent-$(printf 'open\x63ode')"
          if grep -rEnI "$NEEDLE" \
                --exclude-dir=node_modules --exclude-dir=target --exclude-dir=.git \
                . \
              | grep -vE '^\./(MIGRATION\.md|docs/admin/agent-image-digests\.md):' ; then
            echo "::error::Legacy agent image is removed in issue #1076; relocate any new references to MIGRATION.md."
            exit 1
          fi
      # The defect ADR 0031 removed: a reference that floats on the release channel resolves to
      # whatever released most recently, which is a pair no release ever built. The reference is
      # derived from the deployment's own image tag, so nothing may name a channel again.
      - name: Assert no release-channel agent image references
        run: |
          set -euo pipefail
          # Needle built at runtime so this guard file doesn't self-match.
          NEEDLE="agent-pi:$(printf 'lat\x65st')"
          if grep -rEnI "$NEEDLE" \
                --exclude-dir=node_modules --exclude-dir=target --exclude-dir=.git \
                . \
              | grep -vE '^\./(MIGRATION\.md|docs/admin/agent-image-digests\.md|docs/decisions/0031-.*\.md|server/src/test/java/de/tum/cit/aet/hephaestus/agent/sandbox/AgentImageReferenceGuardTest\.java):' ; then
            echo "::error::A release-channel agent image tag resolves to another release's image (ADR 0031). Leave the reference unset so it follows this deployment's image tag, or pin a digest."
            exit 1
          fi

      - name: Assert no legacy agent-image-pin.env references
        run: |
          set -euo pipefail
          if grep -rEnI 'docker/agent-image-pin(\.local)?\.env' \
                --exclude-dir=node_modules --exclude-dir=target --exclude-dir=.git \
                . \
