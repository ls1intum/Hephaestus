name: CD Staging

# Continuously deploy every green commit on main to Staging (app only).
# Runs after CI/CD succeeds on main and deploys that exact commit's immutable
# image (:<sha>). Production stays release-gated with manual approval
# (release.yml -> deploy-prod), so: Staging = main HEAD, Production = released.
#
# App only by design: NATS/webhook (core) and the proxy are stateful/disruptive
# to recreate (a NATS restart forces a JetStream recovery), so they are never
# auto-deployed. When their compose changes, the flag-infra-changes job warns and
# an operator runs "Deploy to Staging" with deploy-core/deploy-proxy = true.

on:
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]
    branches: [main]

concurrency:
  # Serialize CD runs; the reusable deploy-staging.yml serializes actual deploys
  # on its own 'deploy-staging' group. Don't cancel in-progress: never interrupt
  # a running deploy.
  group: cd-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  preflight:
    name: "Check image published"
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image-exists: ${{ steps.check.outputs.exists }}
    steps:
      # The server and the agent image are one runtime contract, so this asks about the PAIR: the
      # server stages TypeScript runners and execs `bun` inside agent-pi, and deploying a commit
      # whose agent image never published leaves the app resolving an unmatched one (ADR 0031).
      #
      # A missing image is normal, not a failure — skip rather than deploy half a pair. Both known
      # causes are benign: skip-duplicate-actions dedups an identical tree, and a CI/CD run
      # cancelled by a later push (merging several PRs in quick succession) leaves the earlier
      # commit's images unpublished.
      - name: Look up the image pair for this commit
        id: check
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          missing=""
          for img in application-server agent-pi; do
            ref="ghcr.io/ls1intum/hephaestus/${img}:${SHA}"
            # Presence is a bare probe on its own exit status, as in release.yml. Reading the digest
            # in the condition instead would test `jq`'s status, and `jq` exits 0 on empty input — an
            # absent image would then look present and the pair would go unchecked.
            if ! docker buildx imagetools inspect "$ref" > /dev/null 2>&1; then
              missing="${missing} ${img}"
              continue
            fi
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r '.digest')
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
              echo "::error::${img} digest at ${SHA} is malformed: ${digest:-<empty>}"; exit 1; }
            echo "${img}: ${digest}"
          done
          if [ -n "$missing" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No \`${missing# }\` image at \`${SHA}\` (build deduplicated or its CI run cancelled) — nothing to deploy." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-staging:
    needs: preflight
    if: needs.preflight.outputs.image-exists == 'true'
    uses: ./.github/workflows/deploy-staging.yml
    with:
      # Deploy the exact commit that passed CI, by its immutable SHA tag.
      image-tag: ${{ github.event.workflow_run.head_sha }}
      deploy-app: true
      deploy-core: false
      deploy-proxy: false
    secrets: inherit

  flag-infra-changes:
    name: "Flag core/proxy changes"
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Warn when core/proxy compose changed
        run: |
          changed=$(git diff --name-only HEAD^ HEAD -- \
            docker/compose.core.yaml docker/compose.proxy.yaml 2>/dev/null || true)
          if [ -n "$changed" ]; then
            list=$(echo "$changed" | paste -sd ', ' -)
            echo "::warning::Changed but NOT auto-deployed: ${list}. Run 'Deploy to Staging' with deploy-core/deploy-proxy=true to apply (recreates NATS/proxy)."
            {
              echo "### ⚠️ Core/proxy compose changed — not auto-deployed"
              echo "\`${list}\` changed on this commit; staging CD deploys **app only**."
              echo "Run **Deploy to Staging** manually with \`deploy-core: true\` (and/or \`deploy-proxy: true\`) to apply — this recreates NATS/proxy."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
