name: API

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions: {}

concurrency:
  group: openapi-autocommit-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate spec and client
    # A fork's token is read-only, so nothing could be pushed back; skip the whole run.
    if: >-
      ${{ github.event.label.name == 'autocommit-openapi'
        && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          install: "frozen"
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version-file: .java-version
      - name: Generate OpenAPI spec and client
        run: vp run generate:api
      - name: Upload generated files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-openapi-${{ github.run_id }}
          path: |
            server/openapi.yaml
            webapp/src/api
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit generated files
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push generated files to the PR branch
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      # Holds the write token: nothing from the checkout or artifact is executed here.
      - name: Checkout PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Remove checked-in client
        run: rm -rf webapp/src/api
      - name: Download generated files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-openapi-${{ github.run_id }}
          path: .
      - name: Commit and push generated files
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add -- server/openapi.yaml webapp/src/api
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update API specs and client"
          # Never force-push: stale runs must fail closed.
          gh auth setup-git
          git push origin "HEAD:$HEAD_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  report:
    name: Report result
    if: >-
      ${{ always()
        && github.event.label.name == 'autocommit-openapi'
        && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [generate, commit]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write # remove the label and comment on the PR
    steps:
      - name: Remove label and report result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GENERATE_RESULT: ${{ needs.generate.result }}
          COMMIT_RESULT: ${{ needs.commit.result }}
          CHANGED: ${{ needs.commit.outputs.changed }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$REPOSITORY/issues/$PR_NUMBER/labels/autocommit-openapi" || true
          if [ "$GENERATE_RESULT" != success ]; then
            comment="🤖 Generating the OpenAPI spec and client failed, so nothing was committed. See the workflow run for the error."
          elif [ "$COMMIT_RESULT" != success ]; then
            comment="🤖 The generated OpenAPI files could not be committed. The branch may have changed during generation; rerun the workflow."
          elif [ "$CHANGED" = true ]; then
            comment="🤖 OpenAPI specs and clients have been automatically updated and committed."
          else
            comment="🤖 No OpenAPI changes were needed — everything is already up to date."
          fi
          gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -f body="$comment"
