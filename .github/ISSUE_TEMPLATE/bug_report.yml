name: 🐞 Bug
description: Something is broken
title: ""
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        <!--
        BEFORE FILING:
        1. Search existing issues to avoid duplicates
        2. Use a clear, descriptive title (not "it doesn't work")
        3. One bug per issue—split multiple problems into separate issues
        -->
        Thanks for taking the time to report this bug!

  - type: textarea
    id: what
    attributes:
      label: What's broken?
      description: Describe what happened vs. what you expected.
      placeholder: |
        When I add "owner/name" to a token-managed workspace, the request finishes but the repository does not appear.
        Expected: The repository should appear in the monitored repository list.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: List the shortest steps you can. A minimal reproduction helps us investigate and prioritise the issue.
      placeholder: |
        1. Open a token-managed workspace
        2. Go to "Admin" → "Integrations"
        3. Enter "owner/name" under "Add a repository"
        4. Select "Add"
        5. The request finishes, but the repository is not listed
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the system is affected?
      options:
        - Webapp (React UI)
        - Application Server (Java/Spring, includes Pi mentor agent)
        - Webhook Server (inbound webhook receiver)
        - Don't know
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Error logs / Screenshots
      description: |
        Paste console errors, network failures, or stack traces.
        For UI bugs, attach a screenshot or screen recording.
      render: shell
      placeholder: |
        TypeError: Cannot read property 'map' of undefined
            at RepositorySettings.tsx:42
            at renderWithHooks (react-dom.development.js:14985)
